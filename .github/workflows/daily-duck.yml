name: The Daily Duck Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: read

jobs:
  daily-duck:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Set up Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # 3. Install Python dependencies
      #
      # send_email.py uses:
      #   from google import genai
      #
      # google-genai is therefore required.
      # ------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-phase2.txt

      # ------------------------------------------------------------
      # 4. Collect news
      # ------------------------------------------------------------
      - name: Collect Daily Duck news
        run: |
          python scripts/collect_news.py

      # ------------------------------------------------------------
      # 5. Rank news with Gemini
      # ------------------------------------------------------------
      - name: Rank Daily Duck news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/rank_news_with_ai.py

      # ------------------------------------------------------------
      # 6. Send Gate A email
      #
      # This now:
      # - generates exactly five image concepts
      # - stores them in gate_a_package.json
      # - emails the Gate A package
      #
      # Valid approval replies later:
      #   1 OK
      #   2 OK
      #   3 OK
      #   4 OK
      #   5 OK
      # ------------------------------------------------------------
      - name: Send Daily Duck email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/send_email.py

      # ------------------------------------------------------------
      # 7. Upload Gate A results
      #
      # IMPORTANT:
      # approval-check.yml downloads this exact artifact name:
      #
      #   daily-duck-results
      #
      # Do not rename it.
      # ------------------------------------------------------------
      - name: Upload Daily Duck results
        uses: actions/upload-artifact@v4
        with:
          name: daily-duck-results
          path: |
            news_candidates.json
            ai_ranked_news.json
            gate_a_package.json
            daily_duck_email.txt
          retention-days: 7


      - name: Notify failure by email
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FAILURE_STAGE: Daily Duck news collection / Gate A email
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/send_workflow_failure_email.py
