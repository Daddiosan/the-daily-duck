name: The Daily Duck Automation

on:
  workflow_dispatch:

  # Every morning at 7:00 JST
  # GitHub Actions cron uses UTC.
  schedule:
    - cron: "0 22 * * *"

jobs:
  daily-duck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Daily Duck start message
        run: |
          echo "The Daily Duck automation started."
          echo "Current UTC time:"
          date
          echo "Target timezone: Asia/Tokyo"

      - name: Collect Daily Duck news candidates
        run: |
          python scripts/collect_news.py

      - name: Rank candidates with Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/rank_news_with_ai.py

      - name: Send Daily Duck email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/send_email.py

      - name: Upload Daily Duck results
        uses: actions/upload-artifact@v4
        with:
          name: daily-duck-news-results
          path: |
            news_candidates.json
            ai_ranked_news.json
            daily_duck_email.txt
          retention-days: 7
