name: The Daily Duck Automation

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target Daily Duck date (YYYY-MM-DD). Leave blank for today JST."
        required: false
        type: string

      recover_2026_11_18:
        description: "Resume the reviewed November 18 failure using its saved candidates."
        type: boolean
        default: false

  schedule:
    # 06:57 JST; allow normal processing time before the 07:00 delivery goal.
    # GitHub cron remains best-effort; an independently scheduled wake is needed.
    - cron: "57 21 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-duck-news-generation
  cancel-in-progress: false

jobs:
  daily-duck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Manual run:
      #   Uses the date entered in Run workflow.
      #
      # Scheduled run:
      #   Empty -> Python scripts should use current JST date.
      DAILY_DUCK_TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}

      # Current Daily Duck specification:
      # exactly 3 image concepts at Gate A.
      IMAGE_CONCEPT_COUNT: "3"
      DAILY_DUCK_DELIVERY_GUARD: "1"

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Set up Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve one issue date and check prior delivery before paid work
        id: delivery_gate
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECOVER_NOVEMBER_18: ${{ inputs.recover_2026_11_18 }}
        run: |
          if [[ "$RECOVER_NOVEMBER_18" != true ]]; then
            python scripts/daily_generation_guard.py --github-output "$GITHUB_OUTPUT"
            exit
          fi
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from scripts import daily_generation_guard as guard

          issue = "2026-11-18"
          original_run = 44228545159
          repository = os.environ["GITHUB_REPOSITORY"]
          today = (datetime.now(guard.JST) - timedelta(hours=7)).date().isoformat()
          if (
              repository != "Daddiosan/the-daily-duck"
              or os.environ["GITHUB_REF"] != "refs/heads/main"
              or os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch"
              or os.environ["GITHUB_RUN_ATTEMPT"] != "1"
              or os.environ["DAILY_DUCK_TARGET_DATE"] != issue
              or today != issue
          ):
              raise SystemExit("Recovery requires a first manual run on main for the active November 18 issue.")

          status = guard.preflight(issue)["status"]
          if status != "HOLD_PRIOR_ATTEMPT_REQUIRES_REVIEW":
              raise SystemExit(f"Recovery stopped by delivery preflight: {status}")

          prefix = f"repos/{repository}/actions"
          history = guard.gh_json(f"{prefix}/artifacts?name=daily-duck-attempt-{issue}&per_page=100")
          markers = history["artifacts"]
          if (
              history["total_count"] != 1
              or len(markers) != 1
              or markers[0]["id"] != 14393154923
              or markers[0]["workflow_run"]["id"] != original_run
          ):
              raise SystemExit("Recovery requires exactly the original attempt marker.")

          run = guard.gh_json(f"{prefix}/runs/{original_run}")
          jobs = guard.gh_json(f"{prefix}/runs/{original_run}/jobs")["jobs"]
          if (
              run["run_attempt"] != 1
              or run["conclusion"] != "failure"
              or len(jobs) != 1
              or jobs[0]["id"] != 134547619527
          ):
              raise SystemExit("The original attempt does not match the reviewed failure.")
          steps = {step["name"]: step["conclusion"] for step in jobs[0]["steps"]}
          if (
              steps.get("Rank Daily Duck news") != "failure"
              or steps.get("Send Daily Duck email") != "skipped"
          ):
              raise SystemExit("The original run did not prove that SMTP was skipped.")

          path = Path("daily_attempt/attempt.json")
          path.parent.mkdir(exist_ok=True)
          path.write_text(
              f'{{"issue_date":"{issue}","recovery_source_run":{original_run},'
              f'"run_id":{int(os.environ["GITHUB_RUN_ID"])}}}\n',
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"issue_date={issue}\nshould_run=true\nstatus=READY_RECOVERY\n")
          PY

      - name: Freeze the resolved issue date across all generation stages
        if: steps.delivery_gate.outputs.should_run == 'true'
        run: echo "DAILY_DUCK_TARGET_DATE=${{ steps.delivery_gate.outputs.issue_date }}" >> "$GITHUB_ENV"

      - name: Persist a dated attempt before any paid model or SMTP call
        if: steps.delivery_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-duck-attempt-${{ steps.delivery_gate.outputs.issue_date }}
          path: daily_attempt/attempt.json
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 3. Install Python dependencies
      # ------------------------------------------------------------
      - name: Install Python dependencies
        if: steps.delivery_gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-phase2.txt

      # ------------------------------------------------------------
      # 4. Show target date
      # ------------------------------------------------------------
      - name: Show Daily Duck target date
        if: steps.delivery_gate.outputs.should_run == 'true'
        run: |
          echo "GitHub event: ${{ github.event_name }}"

          if [ -n "$DAILY_DUCK_TARGET_DATE" ]; then
            echo "Daily Duck target date: $DAILY_DUCK_TARGET_DATE"
          else
            echo "Daily Duck target date: current JST date"
          fi

          echo "Image concept count: $IMAGE_CONCEPT_COUNT"

      # ------------------------------------------------------------
      # 5. Collect news
      # ------------------------------------------------------------
      - name: Collect Daily Duck news
        if: steps.delivery_gate.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_STATUS: ${{ steps.delivery_gate.outputs.status }}
        run: |
          if [[ "$RECOVERY_STATUS" == READY_RECOVERY ]]; then
            gh run download 44228545159 --name daily-duck-results --dir "$RUNNER_TEMP/november-18-candidates"
            cd "$RUNNER_TEMP/november-18-candidates"
            echo '953cb665f2052e99565e4326a735b2f6565f75454c1eaafc2636398097ad7968  news_candidates.json' | sha256sum -c -
            cp news_candidates.json "$GITHUB_WORKSPACE/news_candidates.json"
          else
            python scripts/collect_news.py
          fi

      # ------------------------------------------------------------
      # 6. Rank news with Gemini
      # ------------------------------------------------------------
      - name: Rank Daily Duck news
        if: steps.delivery_gate.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/rank_news_with_ai.py

      # ------------------------------------------------------------
      # 7. Send Gate A email
      #
      # Current flow:
      # - creates exactly 3 image concepts
      # - stores them in gate_a_package.json
      # - emails the Gate A package
      #
      # Valid Gate A concept selections:
      #
      #   1 OK
      #   2 OK
      #   3 OK
      #
      # ------------------------------------------------------------
      - name: Send Daily Duck email
        if: steps.delivery_gate.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
        run: |
          python scripts/send_email.py

      - name: Preserve verified dated mail delivery
        if: steps.delivery_gate.outputs.should_run == 'true' || steps.delivery_gate.outputs.status == 'ALREADY_SENT'
        uses: actions/upload-artifact@v4
        with:
          name: daily-duck-delivered-${{ steps.delivery_gate.outputs.issue_date }}
          path: daily_delivery.json
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 8. Upload Gate A results
      #
      # IMPORTANT:
      # approval-check.yml downloads this exact artifact name:
      #
      #   daily-duck-results
      #
      # Do not rename it.
      # ------------------------------------------------------------
      - name: Upload Daily Duck results
        if: always() && steps.delivery_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-duck-results
          path: |
            news_candidates.json
            ai_ranked_news.json
            gate_a_package.json
            daily_duck_email.txt
          retention-days: 7

      # ------------------------------------------------------------
      # 9. Failure notification
      # ------------------------------------------------------------
      - name: Notify failure by email
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          FAILURE_STAGE: Daily Duck news collection / Gate A email
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/send_workflow_failure_email.py
