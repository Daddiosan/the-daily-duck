name: The Daily Duck Automation

on:
  # 手動テスト用
  workflow_dispatch:

  # 毎朝 7:00 JST に自動実行
  # GitHub Actions の cron は UTC
  schedule:
    - cron: "0 22 * * *"

jobs:
  daily-duck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Daily Duck start message
        run: |
          echo "The Daily Duck automation started successfully."
          echo "Current UTC time:"
          date
          echo "Target timezone: Asia/Tokyo"

      - name: Collect Daily Duck news candidates
        run: |
          python scripts/collect_news.py
