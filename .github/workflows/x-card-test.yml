name: The Daily Duck - X Card Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-x-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Build X card only
        run: |
          python scripts/build_x_card.py

      - name: Validate X card
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          ready_path = Path("automation_state/ready_to_publish.json")
          ready = json.loads(ready_path.read_text(encoding="utf-8"))

          image_path = Path(ready["canonical_x_image_path"])

          if not image_path.exists():
              raise SystemExit(f"X card was not created: {image_path}")

          with Image.open(image_path) as im:
              print(f"X CARD: {image_path}")
              print(f"SIZE: {im.width} x {im.height}")

              if im.size != (1500, 1200):
                  raise SystemExit(
                      f"ERROR: expected 1500x1200, got {im.width}x{im.height}"
                  )

          print("X CARD TEST PASSED")
          print("No X post was made.")
          PY

      - name: Upload generated X card
        uses: actions/upload-artifact@v4
        with:
          name: daily-duck-x-card-test
          path: automation_images/x/*.png
          if-no-files-found: error
          retention-days: 7
