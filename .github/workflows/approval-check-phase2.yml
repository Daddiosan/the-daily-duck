name: The Daily Duck - Gate A Approval Check

on:
  workflow_dispatch:

  schedule:
    - cron: "4,19,34,49 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-duck-gate-a-approval
  cancel-in-progress: false

jobs:
  check-approval:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # 2. Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 3. Dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-phase2.txt

      # ======================================================
      # 4. Find the latest successful Daily Duck Gate A run
      # ======================================================

      - name: Find latest successful Daily Duck Automation run
        id: dailyduck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID=$(gh run list \
            --workflow daily-duck.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "ERROR: No successful daily-duck.yml run found."
            exit 1
          fi

          echo "Latest successful Daily Duck run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # ======================================================
      # 5. Download Gate A artifact
      # ======================================================

      - name: Download latest Daily Duck results artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID="${{ steps.dailyduck.outputs.run_id }}"

          rm -rf gate-a-artifact
          mkdir -p gate-a-artifact

          gh run download "$RUN_ID" \
            --name daily-duck-results \
            --dir gate-a-artifact

          echo "Downloaded artifact contents:"
          find gate-a-artifact -maxdepth 3 -type f -print

      # ======================================================
      # 6. Prepare Gate A package
      # ======================================================

      - name: Prepare Gate A package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE=$(find gate-a-artifact \
            -type f \
            -name "gate_a_package.json" \
            -print \
            -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: gate_a_package.json was not found in the artifact."
            echo "Artifact contents:"
            find gate-a-artifact -maxdepth 5 -type f -print
            exit 1
          fi

          cp "$PACKAGE" gate_a_package.json

          echo "Gate A package copied from:"
          echo "$PACKAGE"

          echo "Gate A package summary:"

          python - <<'PY'
          import json

          with open(
              "gate_a_package.json",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          print(
              "issue_date:",
              data.get("issue_date")
              or data.get("date"),
          )

          print(
              "state:",
              data.get("state"),
          )

          print(
              "story_options:",
              len(
                  data.get(
                      "story_options",
                      [],
                  )
              ),
          )

          print(
              "gate_a_approval_format:",
              data.get(
                  "gate_a_approval_format"
              ),
          )
          PY

      # ======================================================
      # 7. Gate A selection
      #
      # Valid replies:
      #
      #   1
      #   2
      #   3
      #   4
      #   5
      #
      # ======================================================

      - name: Check Gate A story selection
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/check_story_approval.py

      # ======================================================
      # 8. Commit APPROVED_STORY
      # ======================================================

      - name: Commit APPROVED_STORY when created
        id: approval_commit
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/approved_story.json ]; then
            echo "No APPROVED_STORY yet."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/approved_story.json

          if git diff --cached --quiet; then
            echo "No new Gate A approval state to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit \
            -m "Gate A: select Daily Duck story"

          git pull --rebase origin main

          git push origin HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"

      # ======================================================
      # 9. Automatically start Design Options
      #
      # IMPORTANT:
      # Design Options itself is responsible for producing
      # exactly THREE image concepts.
      # ======================================================

      - name: Trigger Design Options automatically
        if: steps.approval_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "New APPROVED_STORY committed."
          echo "Triggering Design Options..."

          gh workflow run design-options.yml \
            --ref main \
            -f force_regenerate=false

          echo "Design Options triggered."

      # ======================================================
      # 10. Report result
      # ======================================================

      - name: Report Gate A result
        shell: bash
        run: |
          echo "Gate A approval check finished."

          if [ -f automation_state/approved_story.json ]; then

            python - <<'PY'
          import json

          with open(
              "automation_state/approved_story.json",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          print(
              "STATE:",
              data.get("state"),
          )

          print(
              "Selected story:",
              data.get(
                  "selected_story_number"
              ),
          )

          print(
              "Issue date:",
              data.get("issue_date"),
          )
          PY

          else
            echo "STATE: WAITING_STORY_SELECTION"
          fi

      # ======================================================
      # 11. Failure notification
      # ======================================================

      - name: Notify failure by email
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FAILURE_STAGE: Gate A approval check
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/send_workflow_failure_email.py
