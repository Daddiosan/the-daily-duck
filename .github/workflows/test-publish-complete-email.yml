name: Test Publish Complete Email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-publish-complete-email:
    name: Test Publish Complete Email
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ======================================================
      # 2. Sync latest main
      # ======================================================

      - name: Sync latest main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

          echo "Repository synchronized to:"
          git rev-parse HEAD

      # ======================================================
      # 3. Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 4. Check publication state
      # ======================================================

      - name: Check publication state files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/ready_to_publish.json ]; then
            echo "ERROR: ready_to_publish.json not found."
            exit 1
          fi

          if [ ! -f automation_state/x_publish_result.json ]; then
            echo "ERROR: x_publish_result.json not found."
            exit 1
          fi

          python - <<'PY'
          import json

          with open(
              "automation_state/ready_to_publish.json",
              encoding="utf-8",
          ) as f:
              ready = json.load(f)

          with open(
              "automation_state/x_publish_result.json",
              encoding="utf-8",
          ) as f:
              x_result = json.load(f)

          issue_date = ready.get(
              "issue_date",
              "",
          )

          x_action = x_result.get(
              "action",
              "",
          )

          print("Issue date:", issue_date)
          print("X action  :", x_action)

          if not issue_date:
              raise SystemExit(
                  "ERROR: issue_date is missing."
              )

          if x_action != "X_POSTED":
              raise SystemExit(
                  "ERROR: X is not confirmed as X_POSTED. "
                  f"Current action: {x_action!r}"
              )

          print("")
          print("Publication state check: OK")
          PY

      # ======================================================
      # 5. Check configuration
      # ======================================================

      - name: Check required configuration
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID }}

          OPENAI_MONTHLY_BUDGET_USD: ${{ vars.OPENAI_MONTHLY_BUDGET_USD }}

        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import sys

          required = [
              "GMAIL_ADDRESS",
              "GMAIL_APP_PASSWORD",
              "EMAIL_TO",
              "OPENAI_ADMIN_KEY",
              "OPENAI_PROJECT_ID",
              "OPENAI_MONTHLY_BUDGET_USD",
          ]

          missing = []

          for name in required:
              value = os.getenv(
                  name,
                  "",
              ).strip()

              if value:
                  print(f"{name}: OK")
              else:
                  print(f"{name}: MISSING")
                  missing.append(name)

          if missing:
              print("")
              print("Missing configuration:")

              for name in missing:
                  print(f" - {name}")

              sys.exit(1)

          budget = float(
              os.environ[
                  "OPENAI_MONTHLY_BUDGET_USD"
              ]
          )

          if budget <= 0:
              raise SystemExit(
                  "OPENAI_MONTHLY_BUDGET_USD "
                  "must be greater than zero."
              )

          print("")
          print("All required configuration is valid.")
          PY

      # ======================================================
      # 6. Read issue date
      # ======================================================

      - name: Read issue date
        id: issue
        shell: bash
        run: |
          set -euo pipefail

          ISSUE_DATE=$(python - <<'PY'
          import json

          with open(
              "automation_state/ready_to_publish.json",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          print(
              data.get(
                  "issue_date",
                  "",
              )
          )
          PY
          )

          if [ -z "$ISSUE_DATE" ]; then
            echo "ERROR: issue_date is empty."
            exit 1
          fi

          echo "issue_date=$ISSUE_DATE" >> "$GITHUB_OUTPUT"

          echo "Issue date: $ISSUE_DATE"

      # ======================================================
      # 7. Send UNIQUE test completion email
      #
      # EMAIL_SUBJECT_SUFFIX uses GitHub run ID.
      #
      # Example:
      #
      # The Daily Duck — Publish Complete — 2026-08-23
      # — TEST-123456789
      #
      # Every test therefore has a unique subject.
      # ======================================================

      - name: Send publish complete email only
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID }}

          OPENAI_MONTHLY_BUDGET_USD: ${{ vars.OPENAI_MONTHLY_BUDGET_USD }}

          ISSUE_DATE: ${{ steps.issue.outputs.issue_date }}

          EMAIL_SUBJECT_SUFFIX: TEST-${{ github.run_id }}

        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Publish Complete Email Test"
          echo "========================================"
          echo ""

          echo "Issue date:"
          echo "$ISSUE_DATE"

          echo ""
          echo "Unique test ID:"
          echo "TEST-${{ github.run_id }}"

          echo ""
          echo "X posting        : DISABLED"
          echo "Website publish  : DISABLED"
          echo "OpenAI generation: DISABLED"

          echo ""
          echo "Enabled:"
          echo "- OpenAI Costs API"
          echo "- Monthly budget calculation"
          echo "- Gmail email sending"

          echo ""
          echo "Sending unique test email..."
          echo ""

          python scripts/send_publish_complete_email.py

          echo ""
          echo "========================================"
          echo " TEST SUCCESS"
          echo "========================================"

          echo ""
          echo "Expected email subject suffix:"
          echo "TEST-${{ github.run_id }}"

          echo ""
          echo "No X post was made."
          echo "No website changes were made."
          echo "No OpenAI model was called."

      # ======================================================
      # 8. Report result
      # ======================================================

      - name: Report billing result
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/publish_complete_notification.json ]; then
            echo "ERROR: notification state file not created."
            exit 1
          fi

          python - <<'PY'
          import json

          path = (
              "automation_state/"
              "publish_complete_notification.json"
          )

          with open(
              path,
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          print("")
          print("========================================")
          print(" Billing / Email Result")
          print("========================================")
          print("")

          print(
              "Email subject:",
              data.get(
                  "email_subject",
                  "",
              ),
          )

          print(
              "Daily OpenAI cost:",
              data.get(
                  "openai_issue_day_cost_usd",
                  "",
              ),
          )

          print(
              "Month-to-date:",
              data.get(
                  "openai_month_to_date_cost_usd",
                  "",
              ),
          )

          print(
              "Monthly budget:",
              data.get(
                  "openai_monthly_budget_usd",
                  "",
              ),
          )

          print(
              "Budget used %:",
              data.get(
                  "openai_monthly_budget_used_percent",
                  "",
              ),
          )

          print(
              "Budget remaining:",
              data.get(
                  "openai_monthly_budget_remaining_usd",
                  "",
              ),
          )

          print(
              "Budget status:",
              data.get(
                  "openai_budget_status",
                  "",
              ),
          )

          print(
              "Action:",
              data.get(
                  "action",
                  "",
              ),
          )
          PY

      # ======================================================
      # 9. Final result
      # ======================================================

      - name: Final report
        if: success()
        run: |
          echo "========================================"
          echo " FINAL RESULT"
          echo "========================================"
          echo ""

          echo "Workflow run ID:"
          echo "${{ github.run_id }}"

          echo ""
          echo "Expected Gmail subject contains:"
          echo "TEST-${{ github.run_id }}"

          echo ""
          echo "STATE: TEST_COMPLETE"
