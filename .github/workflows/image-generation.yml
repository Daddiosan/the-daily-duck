name: The Daily Duck - Image Generation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-phase2.txt
      - name: Generate five images from approved concept
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: gemini-3.1-flash-lite-image
          GEMINI_IMAGE_ASPECT_RATIO: "16:9"
          GEMINI_IMAGE_SIZE: "1K"
        run: python scripts/generate_image_candidates.py
      - name: Email final image candidates
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_image_selection_email.py
      - name: Commit image candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation_state/ automation_images/
          git diff --cached --quiet && exit 0
          git commit -m "Phase 2: generate final image candidates"
          git pull --rebase origin main
          git push origin HEAD:main
