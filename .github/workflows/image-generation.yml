name: Daily Duck Real Images

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "automation_state/approved_image_concept.json"

permissions:
  contents: write

concurrency:
  group: daily-duck-real-images
  cancel-in-progress: false

jobs:
  generate-and-email-images:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenAI SDK
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade openai

      # ======================================================
      # Verify selected image concept
      # ======================================================

      - name: Verify approved image concept
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/approved_image_concept.json ]; then
            echo "ERROR: automation_state/approved_image_concept.json not found."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "automation_state/approved_image_concept.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          state = str(
              data.get("state", "")
          ).strip().upper()

          print(
              f"Detected state: {state}"
          )

          if state != "APPROVED_IMAGE_CONCEPT":
              raise SystemExit(
                  "ERROR: Final image generation requires "
                  "APPROVED_IMAGE_CONCEPT, "
                  f"got {state!r}."
              )

          number = int(
              data.get(
                  "selected_image_concept_number",
                  0
              )
          )

          if number not in (1, 2, 3, 4, 5):
              raise SystemExit(
                  "ERROR: selected_image_concept_number "
                  "must be 1-5."
              )

          concept = data.get(
              "selected_image_concept"
          )

          if not isinstance(concept, dict):
              raise SystemExit(
                  "ERROR: selected_image_concept is missing."
              )

          prompt = str(
              concept.get(
                  "generation_prompt_en",
                  ""
              )
          ).strip()

          if not prompt:
              raise SystemExit(
                  "ERROR: Selected concept has no "
                  "generation_prompt_en."
              )

          print(
              "APPROVED_IMAGE_CONCEPT confirmed."
          )

          print(
              f"Selected concept: {number}"
          )

          print(
              "Exactly five final images will be "
              "generated from ONLY this concept."
          )
          PY

      # ======================================================
      # Generate five FINAL candidates
      # ======================================================

      - name: Generate five final images from selected concept
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_IMAGE_SIZE: 1536x1024
          OPENAI_IMAGE_QUALITY: medium
        run: |
          python scripts/generate_image_candidates_openai.py

      # ======================================================
      # Verify output
      # ======================================================

      - name: Verify five final image candidates
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          state_path = Path(
              "automation_state/image_candidates.json"
          )

          if not state_path.exists():
              raise SystemExit(
                  "ERROR: image_candidates.json not found."
              )

          data = json.loads(
              state_path.read_text(
                  encoding="utf-8"
              )
          )

          state = str(
              data.get("state", "")
          ).strip().upper()

          if state != "IMAGE_CANDIDATES_READY":
              raise SystemExit(
                  "ERROR: Expected IMAGE_CANDIDATES_READY, "
                  f"got {state!r}."
              )

          selected_number = int(
              data.get(
                  "selected_image_concept_number",
                  0
              )
          )

          if selected_number not in (1, 2, 3, 4, 5):
              raise SystemExit(
                  "ERROR: Invalid selected concept number."
              )

          candidates = data.get(
              "candidates"
          )

          if (
              not isinstance(candidates, list)
              or len(candidates) != 5
          ):
              raise SystemExit(
                  "ERROR: Exactly five final candidates "
                  "are required."
              )

          for index, candidate in enumerate(
              candidates,
              start=1
          ):
              if not isinstance(candidate, dict):
                  raise SystemExit(
                      f"ERROR: Candidate {index} "
                      "is not an object."
                  )

              if int(
                  candidate.get("number", 0)
              ) != index:
                  raise SystemExit(
                      f"ERROR: Candidate numbering "
                      f"problem at {index}."
                  )

              candidate_concept = int(
                  candidate.get(
                      "selected_concept_number",
                      0
                  )
              )

              if candidate_concept != selected_number:
                  raise SystemExit(
                      f"ERROR: Candidate {index} "
                      "does not use the selected concept."
                  )

              image_path = Path(
                  str(
                      candidate.get(
                          "image_path",
                          ""
                      )
                  )
              )

              if not image_path.exists():
                  raise SystemExit(
                      f"ERROR: Missing image: {image_path}"
                  )

          print(
              "Exactly five final image candidates confirmed."
          )

          print(
              "All five candidates use selected concept "
              f"#{selected_number}."
          )

          print(
              "Generation round:",
              data.get("generation_round")
          )
          PY

      # ======================================================
      # Email
      # ======================================================

      - name: Send five final images by email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/send_image_selection_email.py

      # ======================================================
      # Artifact
      # ======================================================

      - name: Upload final image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-duck-real-images
          path: |
            automation_state/approved_image_concept.json
            automation_state/image_candidates.json
            automation_state/image_candidates/*.png
            image_selection_email.txt
          retention-days: 7

      # ======================================================
      # Commit
      # ======================================================

      - name: Commit final image candidates
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/image_candidates.json
          git add automation_state/image_candidates/*.png

          if git diff --cached --quiet; then
            echo "No image candidate changes to commit."
            exit 0
          fi

          git commit -m "automation: generate five final images from selected concept"

          git pull --rebase origin main
          git push origin HEAD:main

      # ======================================================
      # Report
      # ======================================================

      - name: Report final image generation
        shell: bash
        run: |
          python - <<'PY'
          import json

          with open(
              "automation_state/image_candidates.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("STATE:", data.get("state"))

          print(
              "Selected concept:",
              data.get(
                  "selected_image_concept_number"
              )
          )

          print(
              "Generation round:",
              data.get(
                  "generation_round"
              )
          )

          print(
              "Final candidates:",
              len(
                  data.get(
                      "candidates",
                      []
                  )
              )
          )
          PY
