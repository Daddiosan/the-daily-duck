name: The Daily Duck - Website Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-duck-website-publish
  cancel-in-progress: false

jobs:
  publish-website:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # Safety gate
      # ======================================================

      - name: Check READY_TO_PUBLISH
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/ready_to_publish.json ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "No ready_to_publish.json."
            exit 0
          fi

          STATE=$(python -c "import json; print(json.load(open('automation_state/ready_to_publish.json', encoding='utf-8')).get('state',''))")

          echo "Detected state: $STATE"

          if [ "$STATE" = "READY_TO_PUBLISH" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "READY_TO_PUBLISH confirmed."
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Website publication skipped."
          fi

      # ======================================================
      # Publish website
      # ======================================================

      - name: Publish website package
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          python scripts/publish_website.py

      # ======================================================
      # Read result
      # ======================================================

      - name: Read publish result
        if: steps.gate.outputs.should_publish == 'true'
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/website_publish_result.json ]; then
            echo "ERROR: website_publish_result.json was not created."
            exit 1
          fi

          ACTION=$(python -c "import json; print(json.load(open('automation_state/website_publish_result.json', encoding='utf-8')).get('action',''))")

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Website publish action: $ACTION"

      # ======================================================
      # Commit successful website publication
      # ======================================================

      - name: Commit published website
        if: |
          steps.gate.outputs.should_publish == 'true' &&
          steps.publish.outputs.action == 'PUBLISHED'
        id: commit_publish
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html
          git add data/today.json
          git add data/archive.json
          git add data/content.js
          git add assets/ducks/
          git add ducks/
          git add automation_state/ready_to_publish.json
          git add automation_state/website_publish_result.json

          if git diff --cached --quiet; then
            echo "No website changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "publish: Daily Duck website"

          git pull --rebase origin main
          git push origin HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"

      # ======================================================
      # Trigger X Publish DIRECTLY
      # ======================================================

      - name: Trigger X Publish
        if: |
          steps.gate.outputs.should_publish == 'true' &&
          steps.publish.outputs.action == 'PUBLISHED' &&
          steps.commit_publish.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Website publication committed successfully."
          echo "Triggering X Publish..."

          gh workflow run x-publish.yml \
            --ref main

          echo "X Publish workflow triggered."

      # ======================================================
      # Duplicate-date safety result
      # ======================================================

      - name: Commit duplicate-date result only
        if: |
          steps.gate.outputs.should_publish == 'true' &&
          steps.publish.outputs.action == 'DUPLICATE_DATE_BLOCKED'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/website_publish_result.json

          if git diff --cached --quiet; then
            echo "No duplicate-date result change to commit."
            exit 0
          fi

          git commit -m "automation: block duplicate Daily Duck publish"

          git pull --rebase origin main
          git push origin HEAD:main

      # ======================================================
      # Report
      # ======================================================

      - name: Report result
        shell: bash
        run: |
          echo "Website workflow finished."

          if [ "${{ steps.gate.outputs.should_publish }}" != "true" ]; then
            echo "STATE: WEBSITE_PUBLISH_SKIPPED"
            exit 0
          fi

          echo "Website action: ${{ steps.publish.outputs.action }}"

          if [ "${{ steps.publish.outputs.action }}" = "PUBLISHED" ]; then
            echo "STATE: PUBLISHED"
            echo "Website publication succeeded."

            if [ "${{ steps.commit_publish.outputs.committed }}" = "true" ]; then
              echo "X Publish trigger requested."
            fi
          fi

          if [ "${{ steps.publish.outputs.action }}" = "DUPLICATE_DATE_BLOCKED" ]; then
            echo "STATE: DUPLICATE_DATE_BLOCKED"
            echo "Existing website content was NOT overwritten."
          fi


      - name: Notify failure by email
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FAILURE_STAGE: Website Publish
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/send_workflow_failure_email.py
