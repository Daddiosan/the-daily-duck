name: The Daily Duck - Website Publish

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "automation_state/ready_to_publish.json"

permissions:
  contents: write

concurrency:
  group: daily-duck-website-publish
  cancel-in-progress: false

jobs:
  publish-website:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check READY_TO_PUBLISH
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/ready_to_publish.json ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "No ready_to_publish.json."
            exit 0
          fi

          STATE=$(python -c "import json; print(json.load(open('automation_state/ready_to_publish.json', encoding='utf-8')).get('state',''))")

          echo "Detected state: $STATE"

          if [ "$STATE" = "READY_TO_PUBLISH" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Website publish skipped."
          fi

      - name: Publish website package
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          python scripts/publish_website.py

      - name: Read publish result
        if: steps.gate.outputs.should_publish == 'true'
        id: publish
        shell: bash
        run: |
          ACTION=$(python -c "import json; print(json.load(open('automation_state/website_publish_result.json', encoding='utf-8'))['action'])")

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Website publish action: $ACTION"

      - name: Commit published website
        if: |
          steps.gate.outputs.should_publish == 'true' &&
          steps.publish.outputs.action == 'PUBLISHED'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html
          git add data/today.json
          git add data/archive.json
          git add data/content.js
          git add assets/ducks/
          git add ducks/
          git add automation_state/ready_to_publish.json
          git add automation_state/website_publish_result.json

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "publish: Daily Duck website"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Commit duplicate-date result only
        if: |
          steps.gate.outputs.should_publish == 'true' &&
          steps.publish.outputs.action == 'DUPLICATE_DATE_BLOCKED'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/website_publish_result.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "automation: block duplicate Daily Duck publish"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report result
        shell: bash
        run: |
          echo "Website workflow finished."

          if [ "${{ steps.gate.outputs.should_publish }}" != "true" ]; then
            echo "No publication required."
          else
            echo "Website action: ${{ steps.publish.outputs.action }}"
          fi
