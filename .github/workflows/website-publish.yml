name: The Daily Duck - Website Publish

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-duck-website-publish
  cancel-in-progress: false

jobs:
  publish-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish website package
        run: python scripts/publish_website.py

      - name: Read publish result
        id: publish
        shell: bash
        run: |
          ACTION=$(python -c "import json; print(json.load(open('automation_state/website_publish_result.json', encoding='utf-8'))['action'])")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Website publish action: $ACTION"

      - name: Commit published website
        if: steps.publish.outputs.action == 'PUBLISHED'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/today.json data/archive.json data/content.js
          git add assets/ducks/ ducks/
          git add automation_state/ready_to_publish.json automation_state/website_publish_result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "publish: Daily Duck website"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Commit duplicate-date result only
        if: steps.publish.outputs.action == 'DUPLICATE_DATE_BLOCKED'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation_state/website_publish_result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "automation: block duplicate Daily Duck publish"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report safety block
        if: steps.publish.outputs.action == 'DUPLICATE_DATE_BLOCKED'
        run: |
          echo "Publication safely blocked."
          echo "Existing website content was NOT overwritten."

      - name: Report successful publish
        if: steps.publish.outputs.action == 'PUBLISHED'
        run: |
          echo "Website package committed successfully."
          echo "READY_TO_PUBLISH -> PUBLISHED"
