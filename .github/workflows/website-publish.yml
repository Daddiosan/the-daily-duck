# Recovery ref only. Keep this override out of main.
name: The Daily Duck - 2026-11-02 Archive Publication
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "PUBLISH-WEB-2026-11-02-IMAGE1-TITLE1"
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: daily-duck-website-publish
  cancel-in-progress: false
jobs:
  publish-november-2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: Production
    steps:
      - name: Check dated publication approval and one-shot execution
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/recovery/2026-11-02"
          test "$GITHUB_ACTOR" = "Daddiosan"
          test "$GITHUB_TRIGGERING_ACTOR" = "Daddiosan"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$CONFIRMATION" = "PUBLISH-WEB-2026-11-02-IMAGE1-TITLE1"
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/website-publish.yml/runs?branch=recovery%2F2026-11-02&per_page=100" --jq .total_count)
          test "$count" = "1"
      - name: Checkout fixed recovery package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: recovery
          persist-credentials: false
      - name: Checkout publication target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: site
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Publish only the approved November 2 archive package
        working-directory: site
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE/recovery/recovery/2026-11-02/publication/package"
          python "$GITHUB_WORKSPACE/recovery/scripts/publish_website.py" \
            --mode ARCHIVE_ONLY --issue-date 2026-11-02 \
            --ready-path "$package/automation_state/ready_to_publish.json" \
            --result-path automation_state/archive_only_2026-11-02_result.json
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          result=json.loads(Path('automation_state/archive_only_2026-11-02_result.json').read_text())
          assert result['action']=='ARCHIVE_ONLY_PUBLISHED'
          assert result['issue_date']=='2026-11-02' and result['title']=='A CHILL DOWN YOUR FEATHERS'
          assert hashlib.sha256(Path('assets/ducks/2026-11-02-skullcape.png').read_bytes()).hexdigest()=='964d9f6da6b37f03745bfd672fc0552c284ee038ffcd66df9bc318e390d7e930'
          old=json.loads(subprocess.check_output(['git','show','HEAD:data/archive.json']))
          new=json.loads(Path('data/archive.json').read_text())
          assert [row for row in new if row['date']!='2026-11-02']==old
          allowed={'data/archive.json','data/content.js'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==allowed,changed
          allowed_new={'assets/ducks/2026-11-02-skullcape.png','ducks/2026-11-02/index.html','automation_state/archive_only_2026-11-02_result.json'}
          actual=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert actual==allowed_new,actual
          PY
      - name: Commit and push reviewed publication paths only
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json data/content.js assets/ducks/2026-11-02-skullcape.png ducks/2026-11-02/index.html automation_state/archive_only_2026-11-02_result.json
          git diff --exit-code
          git commit -m "publish: Daily Duck 2026-11-02 approved archive"
          git push origin HEAD:main
          git rev-parse HEAD > "$GITHUB_WORKSPACE/recovery/recovery/2026-11-02/publication/web_publication_sha.txt"
      - name: Verify deployed page and approved image over HTTPS
        working-directory: recovery
        run: python recovery/2026-11-02/publication/verify_web.py --wait
      - name: Preserve publication result and live verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-duck-2026-11-02-web-publication
          path: |
            site/automation_state/archive_only_2026-11-02_result.json
            recovery/recovery/2026-11-02/publication/web_publication_sha.txt
            recovery/recovery/2026-11-02/publication/web_verification.json
          if-no-files-found: warn
          retention-days: 30
