name: The Daily Duck - Automation Chain Audit

on:
  workflow_dispatch:

  schedule:
    # JST 08:20 / 12:20 / 18:20 / 22:20
    - cron: "20 23 * * *"
    - cron: "20 3 * * *"
    - cron: "20 9 * * *"
    - cron: "20 13 * * *"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit automatic + manual chain
        run: python scripts/automation_chain_audit.py
