name: The Daily Duck - Automation Chain Audit

on:
  workflow_dispatch:

  schedule:
    # JST 08:20 / 12:20 / 18:20 / 22:20
    # UTC 23:20 / 03:20 / 09:20 / 13:20
    #
    # Avoid GitHub Actions congestion around :00.
    - cron: "20 23 * * *"
    - cron: "20 3 * * *"
    - cron: "20 9 * * *"
    - cron: "20 13 * * *"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Set up Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # 3. Run automation chain audit
      #
      # IMPORTANT:
      # - Save all audit output to audit_output.txt
      # - Preserve the Python exit code
      # - Show the output in GitHub Actions log
      # - Exit with the original audit result
      #
      # Exit code:
      #   0 = healthy
      #   1 = automation problem detected
      #   2 = audit execution problem
      # ------------------------------------------------------------
      - name: Run automation chain audit
        id: chain_audit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set +e

          python scripts/automation_chain_audit.py \
            > audit_output.txt 2>&1

          EXIT_CODE=$?

          echo "============================================================"
          echo "AUTOMATION CHAIN AUDIT OUTPUT"
          echo "============================================================"

          cat audit_output.txt

          echo "============================================================"
          echo "AUDIT EXIT CODE: $EXIT_CODE"
          echo "============================================================"

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit "$EXIT_CODE"

      # ------------------------------------------------------------
      # 4. Send automation chain alert
      #
      # Runs only when the audit step fails.
      #
      # The complete audit output is passed to
      # send_workflow_failure_email.py as AUDIT_DETAILS.
      # ------------------------------------------------------------
      - name: Send automation chain alert
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          FAILURE_STAGE: Scheduled workflow health check

          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          GITHUB_REPOSITORY: ${{ github.repository }}

        shell: bash
        run: |
          if [ -f audit_output.txt ]; then
            {
              echo 'AUDIT_DETAILS<<EOF'
              cat audit_output.txt
              echo 'EOF'
            } >> "$GITHUB_ENV"
          else
            {
              echo 'AUDIT_DETAILS<<EOF'
              echo "The automation audit failed before an audit report could be created."
              echo "Open the GitHub Actions run and inspect the failed step."
              echo 'EOF'
            } >> "$GITHUB_ENV"
          fi

          python scripts/send_workflow_failure_email.py
