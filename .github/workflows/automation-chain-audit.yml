name: The Daily Duck - Automation Chain Audit

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Audit, or record a response and resume morning generation
        type: choice
        options:
          - audit
          - acknowledge
        default: audit
  schedule:
    # Every three hours at :20 JST, including a check at 07:20 JST.
    - cron: "20 1-23/3 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-duck-automation-chain-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record response and resume morning generation
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'acknowledge'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/daily_duck_operations.py acknowledge

      - name: Audit and reserve an eligible reminder
        id: chain_audit
        if: github.event_name == 'schedule' || inputs.operation != 'acknowledge'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python scripts/automation_chain_audit.py --manage-reminders

      - name: Check whether a reminder was reserved
        id: alert
        if: steps.chain_audit.outcome == 'failure' && hashFiles('monitor_state/pending_alerts.json') != ''
        run: |
          if python -c 'import json; import sys; sys.exit(not json.load(open("monitor_state/pending_alerts.json"))["alerts"])'; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send consolidated reminder
        if: steps.alert.outputs.send == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || vars.EMAIL_TO }}
          FAILURE_STAGE: Scheduled workflow health check
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTOMATION_ALERTS_FILE: monitor_state/pending_alerts.json
        run: python scripts/send_workflow_failure_email.py

      - name: Mark unhealthy audit as failed
        if: always() && steps.chain_audit.outcome == 'failure'
        run: exit 1
