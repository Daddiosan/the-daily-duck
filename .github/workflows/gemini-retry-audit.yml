name: The Daily Duck - Gemini Retry Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Gemini 429 retry protection
        run: python scripts/gemini_retry_audit.py
