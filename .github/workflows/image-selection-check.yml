name: The Daily Duck - Final Image Selection Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  check-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-phase2.txt
      - name: Check final image reply
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/check_image_selection.py
      - name: Read Gate B action
        id: gateb
        shell: bash
        run: |
          ACTION=$(python -c "import json; print(json.load(open('automation_state/gate_b_result.json',encoding='utf-8'))['action'])")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
      - name: Generate NEXT 5
        if: steps.gateb.outputs.action == 'REGENERATE_IMAGES'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: gemini-3.1-flash-lite-image
          GEMINI_IMAGE_ASPECT_RATIO: "16:9"
          GEMINI_IMAGE_SIZE: "1K"
        run: python scripts/generate_image_candidates.py
      - name: Email NEXT 5
        if: steps.gateb.outputs.action == 'REGENERATE_IMAGES'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_image_selection_email.py
      - name: Commit state
        if: steps.gateb.outputs.action != 'WAIT'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation_state/ automation_images/
          git diff --cached --quiet && exit 0
          git commit -m "Phase 2: final image ${{ steps.gateb.outputs.action }}"
          git pull --rebase origin main
          git push origin HEAD:main
