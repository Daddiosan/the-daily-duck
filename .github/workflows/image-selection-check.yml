name: The Daily Duck - Final Image Selection Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: daily-duck-final-image-selection
  cancel-in-progress: false

jobs:
  check-selection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check final image reply
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/check_image_selection.py

      - name: Read final image action
        id: finalimage
        shell: bash
        run: |
          ACTION=$(python -c "import json; print(json.load(open('automation_state/gate_b_result.json', encoding='utf-8'))['action'])")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Final image action: $ACTION"

      - name: Commit final image state
        if: steps.finalimage.outputs.action == 'READY_TO_PUBLISH'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/image_candidates.json
          git add automation_state/ready_to_publish.json
          git add automation_state/gate_b_result.json
          git add automation_images/canonical/

          if git diff --cached --quiet; then
            echo "No final image state changes to commit."
            exit 0
          fi

          git commit -m "Phase 2: lock canonical image and mark READY_TO_PUBLISH"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Phase 2 boundary
        if: steps.finalimage.outputs.action == 'READY_TO_PUBLISH'
        run: |
          echo "READY_TO_PUBLISH created."
          echo "The selected existing PNG is now the canonical image."
          echo "Website/X publishing is intentionally NOT started here."
