name: The Daily Duck - Regenerate Titles Only

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-duck-regenerate-titles
  cancel-in-progress: false

jobs:
  regenerate-titles:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # 1. Checkout latest repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

          echo "Repository synchronized to:"
          git rev-parse HEAD

      # ======================================================
      # 2. Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 3. Dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-phase2.txt

      # ======================================================
      # 4. Verify current design package
      #
      # This workflow MUST preserve the existing:
      # - 3 concepts
      # - 3 real images
      #
      # Only title_ideas may be regenerated.
      # ======================================================

      - name: Verify existing 3-image design package
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("automation_state/design_options.json")

          if not p.exists():
              raise SystemExit(
                  "automation_state/design_options.json not found."
              )

          data = json.loads(
              p.read_text(encoding="utf-8")
          )

          issue_date = (
              data.get("issue_date")
              or data.get("date")
          )

          concepts = data.get("image_concepts")
          previews = data.get("design_previews")

          if not issue_date:
              raise SystemExit(
                  "issue_date is missing."
              )

          if not isinstance(concepts, list) or len(concepts) != 3:
              raise SystemExit(
                  "Expected exactly 3 image concepts."
              )

          if not isinstance(previews, list) or len(previews) != 3:
              raise SystemExit(
                  "Expected exactly 3 real image previews."
              )

          for index, preview in enumerate(previews, start=1):
              if not isinstance(preview, dict):
                  raise SystemExit(
                      f"Preview {index} is invalid."
                  )

              image_path = Path(
                  str(preview.get("image_path") or "")
              )

              if not image_path.exists():
                  raise SystemExit(
                      f"Preview image missing: {image_path}"
                  )

          print("Issue:", issue_date)
          print("Concepts: 3")
          print("Existing real images: 3")
          print("Safe to regenerate titles only.")
          PY

      # ======================================================
      # 5. Regenerate ONLY the 3 titles
      #
      # No OpenAI image key is provided intentionally.
      # This guarantees this step cannot generate images.
      # ======================================================

      - name: Regenerate 3 Daily Duck pun-style titles only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.6-flash
        run: |
          python scripts/regenerate_titles.py

      # ======================================================
      # 6. Verify images were not replaced
      # ======================================================

      - name: Verify title-only regeneration result
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json

          with open(
              "automation_state/design_options.json",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          titles = data.get("title_ideas")
          previews = data.get("design_previews")

          if not isinstance(titles, list) or len(titles) != 3:
              raise SystemExit(
                  "Expected exactly 3 regenerated title ideas."
              )

          if not isinstance(previews, list) or len(previews) != 3:
              raise SystemExit(
                  "Existing 3 images were not preserved."
              )

          print("Regenerated titles:")
          for item in titles:
              print(
                  f"{item.get('number')}: "
                  f"{item.get('title')}"
              )

          print("Existing images preserved: 3")
          print("STATE:", data.get("state"))
          PY

      # ======================================================
      # 7. Resend the SAME 3 existing images
      #    with the NEW Duck-style titles
      # ======================================================

      - name: Send updated design selection email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/send_design_approval_email.py

      # ======================================================
      # 8. Commit updated title state only
      #
      # Existing preview files may already be tracked and should
      # remain unchanged; this commit primarily records the new
      # title_ideas and email waiting state.
      # ======================================================

      - name: Commit regenerated titles and email state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/design_options.json

          if git diff --cached --quiet; then
            echo "No title/email-state changes to commit."
            exit 0
          fi

          git commit \
            -m "Phase 2: regenerate Daily Duck pun titles"

          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # ======================================================
      # 9. Report
      # ======================================================

      - name: Report result
        run: |
          echo "Title-only regeneration completed."
          echo "No real images were regenerated."
          echo "The existing 3 images were re-sent with new Duck-style titles."
          echo "Reply with: IMAGE_NUMBER TITLE_NUMBER"
          echo "Example: 1 3"
          echo "Full-width example: １ ３"
          echo "STATE: WAITING_FINAL_SELECTION"

      # ======================================================
      # 10. Failure notification
      # ======================================================

      - name: Notify failure by email
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FAILURE_STAGE: Regenerate Daily Duck titles only
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/send_workflow_failure_email.py
