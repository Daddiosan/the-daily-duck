name: The Daily Duck - Design Options

on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "Regenerate today's 3 concept+image options even if already created"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-duck-design-options
  cancel-in-progress: false

jobs:
  approved-story-to-design-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-phase2.txt
          pip install Pillow

      - name: Verify APPROVED_STORY
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("automation_state/approved_story.json")
          if not p.exists():
              raise SystemExit("approved_story.json not found.")

          d = json.loads(p.read_text(encoding="utf-8"))

          if d.get("state") != "APPROVED_STORY":
              raise SystemExit(
                  f"Expected APPROVED_STORY, got {d.get('state')!r}"
              )

          print(
              "APPROVED_STORY OK:",
              d.get("issue_date") or d.get("date")
          )
          PY

      - name: Check whether today's design package already exists
        id: design_gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          approved = json.loads(
              Path("automation_state/approved_story.json")
              .read_text(encoding="utf-8")
          )

          issue = approved.get("issue_date") or approved.get("date")
          force = "${{ inputs.force_regenerate }}" == "true"

          p = Path("automation_state/design_options.json")

          same_issue = False
          existing_state = ""

          if p.exists():
              try:
                  d = json.loads(p.read_text(encoding="utf-8"))
                  same_issue = d.get("issue_date") == issue
                  existing_state = str(d.get("state") or "")
              except Exception:
                  pass

          should_run = force or not same_issue

          print(f"should_run={'true' if should_run else 'false'}")
          print(f"issue_date={issue}")
          print(f"existing_state={existing_state}")
          PY

      - name: Report existing design package
        if: steps.design_gate.outputs.should_run != 'true'
        run: |
          echo "A design package already exists for this issue."
          echo "Automatic duplicate generation is skipped."
          echo "Use force_regenerate=true only when deliberate regeneration is required."

      - name: Clear only stale downstream state
        if: steps.design_gate.outputs.should_run == 'true'
        run: |
          python scripts/reset_after_approved_story.py

      - name: Generate 3 concepts + 3 real images + 3 titles in 51x58 final ratio
        if: steps.design_gate.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.6-flash
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_IMAGE_SIZE: "1536x1024"
          OPENAI_IMAGE_QUALITY: medium
        run: |
          python scripts/generate_image_concepts.py

      - name: Send design selection email with 3 images
        if: steps.design_gate.outputs.should_run == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/send_design_approval_email.py

      - name: Commit design-stage output
        if: steps.design_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/
          git add automation_images/design_previews/

          echo "=== Git status before commit ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Phase 2: create 3 concept images and 3 titles"

          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Phase boundary
        if: steps.design_gate.outputs.should_run == 'true'
        run: |
          echo "Exactly 3 image concepts created."
          echo "Exactly 1 real image generated for each concept."
          echo "Final source-image ratio: 51:58 (width:height)."
          echo "Final stored size: 1020x1160."
          echo "No stretching or squashing is allowed."
          echo "Exactly 3 title ideas created."
          echo "One email with all 3 images was sent."
          echo "Waiting for: IMAGE_NUMBER TITLE_NUMBER"
          echo "Examples: 1 3 / １ ３"
          echo "NEXT 3 regenerates all 3 concept images."
          echo "No website or X publication occurs here."

      - name: Notify failure by email
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FAILURE_STAGE: Design Options - 3 concepts + 3 images + 3 titles
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/send_workflow_failure_email.py
