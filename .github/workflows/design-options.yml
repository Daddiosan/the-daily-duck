# Recovery-branch override only. NEVER merge this workflow into main.
name: The Daily Duck - 2026-11-02 Isolated Design Options

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "GENERATE-AND-EMAIL-2026-11-02-USD050"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-duck-recovery-2026-11-02-design-email
  cancel-in-progress: false

jobs:
  generate-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Enforce isolated branch and one-shot human confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/recovery/2026-11-02"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_ACTOR" = "Daddiosan"
          test "$GITHUB_TRIGGERING_ACTOR" = "Daddiosan"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$RECOVERY_CONFIRMATION" = "GENERATE-AND-EMAIL-2026-11-02-USD050"

      - name: Reject a second recovery run before any paid request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/design-options.yml/runs?branch=recovery%2F2026-11-02&per_page=100" > "$RUNNER_TEMP/recovery-runs.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "recovery-runs.json").read_text())
          assert data["total_count"] == 1, "Prior recovery run exists; inspect evidence before any restart"
          assert str(data["workflow_runs"][0]["id"]) == os.environ["GITHUB_RUN_ID"]
          PY

      - name: Checkout approved recovery branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install existing pinned recovery dependencies
        run: python -m pip install -r requirements-backfill-2026-10-11.txt

      - name: Confirm cost estimate and target story without paid calls
        run: python recovery/2026-11-02/run_design.py --offline

      - name: Generate three images using existing Daily Duck generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_IMAGE_SIZE: "1536x1024"
          OPENAI_IMAGE_QUALITY: medium
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python recovery/2026-11-02/run_design.py --generate

      - name: Preserve generated assets before SMTP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-duck-recovery-2026-11-02-before-email
          path: |
            recovery/2026-11-02/candidate/
            recovery/2026-11-02/execution/
            recovery/2026-11-02/design_brief.json
          if-no-files-found: error
          retention-days: 30

      - name: Send existing-format image and title selection email once
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python recovery/2026-11-02/run_design.py --send

      - name: Preserve results including partial failure or uncertain SMTP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-duck-recovery-2026-11-02-result
          path: |
            recovery/2026-11-02/candidate/
            recovery/2026-11-02/execution/
            recovery/2026-11-02/design_brief.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify tracked production files stayed unchanged
        run: git diff --exit-code

      - name: Stop at human image and title selection
        run: echo "WAITING_HUMAN_SELECTION; NO_WEB_PUBLISH; NO_X_POST; NO_GIT_PUSH"
