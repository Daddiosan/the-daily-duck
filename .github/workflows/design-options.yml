name: The Daily Duck - Design Options

on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "Regenerate today's concept package even if already created"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-duck-design-options
  cancel-in-progress: false

jobs:
  approved-story-to-concept-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-phase2.txt

      - name: Verify APPROVED_STORY
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("automation_state/approved_story.json")

          if not p.exists():
              raise SystemExit("approved_story.json not found.")

          d = json.loads(
              p.read_text(encoding="utf-8")
          )

          if d.get("state") != "APPROVED_STORY":
              raise SystemExit(
                  f"Expected APPROVED_STORY, got {d.get('state')!r}"
              )

          print(
              "APPROVED_STORY OK:",
              d.get("issue_date") or d.get("date")
          )
          PY

      - name: Check whether today's concept package already exists
        id: concept_gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          approved = json.loads(
              Path("automation_state/approved_story.json")
              .read_text(encoding="utf-8")
          )

          issue = (
              approved.get("issue_date")
              or approved.get("date")
          )

          force = "${{ inputs.force_regenerate }}" == "true"

          p = Path("automation_state/design_options.json")

          same_issue = False
          existing_state = ""

          if p.exists():
              try:
                  d = json.loads(
                      p.read_text(encoding="utf-8")
                  )

                  same_issue = (
                      d.get("issue_date") == issue
                  )

                  existing_state = str(
                      d.get("state") or ""
                  )

              except Exception:
                  pass

          should_run = force or not same_issue

          print(
              f"should_run={'true' if should_run else 'false'}"
          )

          print(
              f"issue_date={issue}"
          )

          print(
              f"existing_state={existing_state}"
          )
          PY

      - name: Report existing concept package
        if: steps.concept_gate.outputs.should_run != 'true'
        run: |
          echo "A design/concept package already exists for this issue."
          echo "Automatic duplicate generation is skipped."
          echo "If deliberate regeneration is required, run this workflow with force_regenerate=true."

      - name: Clear only stale downstream state
        if: steps.concept_gate.outputs.should_run == 'true'
        run: python scripts/reset_after_approved_story.py

      - name: Generate exactly 5 concepts + exactly 3 titles with Gemini
        if: steps.concept_gate.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.6-flash
        run: python scripts/generate_image_concepts.py

      - name: Send concept selection email
        if: steps.concept_gate.outputs.should_run == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_design_approval_email.py

      - name: Commit concept-stage output
        if: steps.concept_gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A automation_state

          echo "=== Git status before commit ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Phase 2: create 5 image concepts and 3 titles"

          echo "=== Git status after commit ==="
          git status --short

          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Phase boundary
        if: steps.concept_gate.outputs.should_run == 'true'
        run: |
          echo "5 image concepts created."
          echo "Concept selection email sent."
          echo "Waiting for exact reply: 1 / 2 / 3 / 4 / 5"
          echo "No real images have been generated yet."
          echo "No website or X publication occurs in this workflow."

      - name: Notify failure by email
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FAILURE_STAGE: Design Options - 5 concepts + 3 titles
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/send_workflow_failure_email.py
