name: The Daily Duck - X Publish

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-duck-x-publish
  cancel-in-progress: false

jobs:
  publish-x:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install X card and publishing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install Pillow requests requests-oauthlib

      - name: Build fixed 5:4 Daily Duck X card
        run: |
          python scripts/build_x_card.py

      - name: Validate X card ratio
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          ready = json.load(open('automation_state/ready_to_publish.json', encoding='utf-8'))
          p = Path(ready['canonical_x_image_path'])
          with Image.open(p) as im:
              print('X image:', p)
              print('Size:', im.size)
              if im.size != (1500, 1200):
                  raise SystemExit(f'Unexpected X image size: {im.size}; expected 1500x1200')
          PY

      - name: Publish to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python scripts/publish_x.py

      - name: Read X publish result
        id: xpublish
        shell: bash
        run: |
          ACTION=$(python -c "import json; print(json.load(open('automation_state/x_publish_result.json', encoding='utf-8'))['action'])")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "X publish action: $ACTION"

      - name: Commit X card and X post state
        if: steps.xpublish.outputs.action == 'X_POSTED'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/ready_to_publish.json
          git add automation_state/x_publish_result.json
          git add automation_images/x/

          if git diff --cached --quiet; then
            echo "No X publish state changes to commit."
            exit 0
          fi

          git commit -m "publish: Daily Duck 5x4 card to X"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Commit blocked X result
        if: |
          steps.xpublish.outputs.action == 'WEBSITE_NOT_PUBLISHED_BLOCKED' ||
          steps.xpublish.outputs.action == 'WEBSITE_STATE_NOT_PUBLISHED_BLOCKED' ||
          steps.xpublish.outputs.action == 'ALREADY_POSTED_BLOCKED' ||
          steps.xpublish.outputs.action == 'ALREADY_POSTED_REMOTE_BLOCKED'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation_state/x_publish_result.json
          if [ -f automation_state/ready_to_publish.json ]; then
            git add automation_state/ready_to_publish.json
          fi
          if git diff --cached --quiet; then
            echo "No blocked-state change to commit."
            exit 0
          fi
          git commit -m "automation: record blocked X publish"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report X publish result
        run: |
          echo "X workflow finished."
          echo "Result: ${{ steps.xpublish.outputs.action }}"


      - name: Notify failure by email
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FAILURE_STAGE: X Publish
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/send_workflow_failure_email.py
