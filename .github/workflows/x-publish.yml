# Recovery ref only. Keep this one-date override out of main.
name: The Daily Duck - 2026-11-02 Verified X Publication
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "PUBLISH-X-2026-11-02-IMAGE1-TITLE1"
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: daily-duck-x-publish
  cancel-in-progress: false
jobs:
  publish-november-2-x:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: Production
    env:
      PUBLICATION_CONFIRMATION: ${{ inputs.confirmation }}
      PUBLICATION_SITE: ${{ github.workspace }}/site
    steps:
      - name: Require dated human approval and reject repeat runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/recovery/2026-11-02"
          test "$GITHUB_ACTOR" = "Daddiosan"
          test "$GITHUB_TRIGGERING_ACTOR" = "Daddiosan"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$PUBLICATION_CONFIRMATION" = "PUBLISH-X-2026-11-02-IMAGE1-TITLE1"
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/x-publish.yml/runs?branch=recovery%2F2026-11-02&per_page=100" --jq .total_count)
          test "$count" = "1"
      - name: Checkout approved publication package and adapter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: recovery
          persist-credentials: false
      - name: Checkout authoritative publication state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: site
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install existing pinned publication dependencies
        run: python -m pip install -r recovery/requirements-backfill-2026-10-11.txt
      - name: Verify live Web, cost and complete bounded duplicate scan
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python recovery/recovery/2026-11-02/publication/publish_x_once.py prepare
      - name: Arm and durably commit one posting attempt
        id: checkpoint
        working-directory: site
        run: |
          set -euo pipefail
          python ../recovery/recovery/2026-11-02/publication/publish_x_once.py arm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation_state/x_backfill_2026-11-02_result.json automation_images/x_backfill/2026-11-02-x-card.png
          git diff --exit-code
          git commit -m "automation: arm approved 2026-11-02 X publication"
          git push origin HEAD:main
          echo "armed=true" >> "$GITHUB_OUTPUT"
      - name: Post once and verify returned tweet through X API
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python recovery/recovery/2026-11-02/publication/publish_x_once.py post
      - name: Preserve final or uncertain result without retrying any X write
        if: always() && steps.checkpoint.outputs.armed == 'true'
        working-directory: site
        run: |
          set -euo pipefail
          git add automation_state/x_backfill_2026-11-02_result.json
          if git diff --cached --quiet; then
            echo "No final state change; POST_IN_FLIGHT remains authoritative"
            exit 0
          fi
          git commit -m "automation: record 2026-11-02 X publication result"
          git push origin HEAD:main
      - name: Upload exact publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-duck-2026-11-02-x-publication
          path: |
            site/automation_state/x_backfill_2026-11-02_result.json
            site/automation_images/x_backfill/2026-11-02-x-card.png
          if-no-files-found: warn
          retention-days: 30
