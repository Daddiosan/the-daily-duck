name: The Daily Duck - X Publish

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "automation_state/website_publish_result.json"

permissions:
  contents: write

concurrency:
  group: daily-duck-x-publish
  cancel-in-progress: false

jobs:
  publish-x:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install X publishing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests requests-oauthlib

      - name: Check website publish result
        id: website
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/website_publish_result.json ]; then
            echo "should_post=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ACTION=$(python -c "import json; print(json.load(open('automation_state/website_publish_result.json', encoding='utf-8')).get('action',''))")

          echo "Website action: $ACTION"

          if [ "$ACTION" = "PUBLISHED" ]; then
            echo "should_post=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_post=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to X
        if: steps.website.outputs.should_post == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python scripts/publish_x.py

      - name: Read X publish result
        if: steps.website.outputs.should_post == 'true'
        id: xpublish
        shell: bash
        run: |
          ACTION=$(python -c "import json; print(json.load(open('automation_state/x_publish_result.json', encoding='utf-8'))['action'])")

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "X publish action: $ACTION"

      - name: Commit X post state
        if: |
          steps.website.outputs.should_post == 'true' &&
          steps.xpublish.outputs.action == 'X_POSTED'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/ready_to_publish.json
          git add automation_state/x_publish_result.json

          if git diff --cached --quiet; then
            echo "No X publish state changes."
            exit 0
          fi

          git commit -m "publish: Daily Duck to X"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report X result
        shell: bash
        run: |
          if [ "${{ steps.website.outputs.should_post }}" != "true" ]; then
            echo "X posting skipped because website is not PUBLISHED."
          else
            echo "X result: ${{ steps.xpublish.outputs.action }}"
          fi
