name: The Daily Duck - X Publish

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-duck-x-publish
  cancel-in-progress: false

jobs:
  publish-x:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install X publishing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests requests-oauthlib

      - name: Publish to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python scripts/publish_x.py

      - name: Read X publish result
        id: xpublish
        shell: bash
        run: |
          ACTION=$(python -c "import json; print(json.load(open('automation_state/x_publish_result.json', encoding='utf-8'))['action'])")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "X publish action: $ACTION"

      - name: Commit X post state
        if: steps.xpublish.outputs.action == 'X_POSTED'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/ready_to_publish.json
          git add automation_state/x_publish_result.json

          if git diff --cached --quiet; then
            echo "No X publish state changes to commit."
            exit 0
          fi

          git commit -m "publish: Daily Duck to X"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Commit blocked X result
        if: |
          steps.xpublish.outputs.action == 'WEBSITE_NOT_PUBLISHED_BLOCKED' ||
          steps.xpublish.outputs.action == 'WEBSITE_STATE_NOT_PUBLISHED_BLOCKED' ||
          steps.xpublish.outputs.action == 'ALREADY_POSTED_BLOCKED'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/x_publish_result.json

          if git diff --cached --quiet; then
            echo "No blocked-state change to commit."
            exit 0
          fi

          git commit -m "automation: record blocked X publish"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report X publish result
        run: |
          echo "X workflow finished."
          echo "Result: ${{ steps.xpublish.outputs.action }}"
