name: The Daily Duck - Design Selection Check

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-duck-design-selection
  cancel-in-progress: false

jobs:
  check-selection:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # 2. Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 3. Dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-phase2.txt

      # ======================================================
      # 4. Check current design-selection reply
      #
      # Concept selection:
      #   1 / 2 / 3
      #   １ / ２ / ３
      #
      # Final selection:
      #   IMAGE_NUMBER TITLE_NUMBER
      #
      #   image: 1-3
      #   title: 1-3
      #
      # Examples:
      #   2 1
      #   ２ １
      #
      # Regeneration:
      #   NEXT 3
      #   ＮＥＸＴ ３
      #
      # Full-width normalization is handled by
      # scripts/check_design_selection.py
      # ======================================================

      - name: Check current design reply
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/check_design_selection.py

      # ======================================================
      # 5. Read checker result
      # ======================================================

      - name: Read result
        id: result
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/design_selection_result.json ]; then
            echo "ERROR: design_selection_result.json not found."
            exit 1
          fi

          ACTION=$(python -c "
          import json

          with open(
              'automation_state/design_selection_result.json',
              encoding='utf-8'
          ) as f:
              data = json.load(f)

          print(data.get('action', ''))
          ")

          if [ -z "$ACTION" ]; then
            echo "ERROR: design selection action is empty."
            exit 1
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Design action: $ACTION"

      # ======================================================
      # STAGE A
      #
      # Human selected ONE of the THREE image concepts.
      #
      # Persist the selected concept before generating
      # paid real images.
      # ======================================================

      - name: Commit selected image concept
        if: steps.result.outputs.action == 'APPROVED_IMAGE_CONCEPT'
        id: concept_commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/

          if git diff --cached --quiet; then
            echo "No new concept selection to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit \
            -m "Phase 2: approve image concept"

          git pull --rebase --autostash origin main
          git push origin HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"

      # ======================================================
      # Generate exactly THREE real images
      # from the ONE selected concept.
      # ======================================================

      - name: Generate exactly 3 real images from selected concept
        if: steps.result.outputs.action == 'APPROVED_IMAGE_CONCEPT'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_IMAGE_SIZE: "1536x1024"
          OPENAI_IMAGE_QUALITY: medium
          REAL_IMAGE_COUNT: "3"
        run: |
          python scripts/generate_design_previews.py

      # ======================================================
      # Send final image + title selection email
      #
      # Real images:
      #   1 / 2 / 3
      #
      # Titles:
      #   1 / 2 / 3
      #
      # Example:
      #   2 1
      #
      # ======================================================

      - name: Send final image + title approval email
        if: steps.result.outputs.action == 'APPROVED_IMAGE_CONCEPT'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/send_design_approval_email.py

      # ======================================================
      # Commit THREE-image batch
      # ======================================================

      - name: Commit real-image batch
        if: steps.result.outputs.action == 'APPROVED_IMAGE_CONCEPT'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/
          git add automation_images/design_previews/

          if git diff --cached --quiet; then
            echo "No real-image batch changes to commit."
            exit 0
          fi

          git commit \
            -m "Phase 2: generate 3 real image candidates"

          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # ======================================================
      # STAGE B — NEXT 3
      #
      # NEXT 3 keeps the selected concept LOCKED.
      #
      # A fresh batch of exactly THREE real images is
      # generated from the SAME selected concept.
      # ======================================================

      - name: Commit NEXT 3 request
        if: steps.result.outputs.action == 'NEXT_3_REQUESTED'
        id: next3_commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/

          if git diff --cached --quiet; then
            echo "No NEXT 3 request changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit \
            -m "Phase 2: request NEXT 3 image batch"

          git pull --rebase --autostash origin main
          git push origin HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"

      # ======================================================
      # Generate NEXT THREE images
      # from SAME locked concept.
      # ======================================================

      - name: Generate NEXT 3 real images from same selected concept
        if: steps.result.outputs.action == 'NEXT_3_REQUESTED'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_IMAGE_SIZE: "1536x1024"
          OPENAI_IMAGE_QUALITY: medium
          REAL_IMAGE_COUNT: "3"
        run: |
          python scripts/generate_design_previews.py

      # ======================================================
      # Send NEXT 3 batch email
      # ======================================================

      - name: Send NEXT 3 final approval email
        if: steps.result.outputs.action == 'NEXT_3_REQUESTED'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/send_design_approval_email.py

      # ======================================================
      # Commit NEXT THREE image batch
      # ======================================================

      - name: Commit NEXT 3 image batch
        if: steps.result.outputs.action == 'NEXT_3_REQUESTED'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/
          git add automation_images/design_previews/

          if git diff --cached --quiet; then
            echo "No NEXT 3 image changes to commit."
            exit 0
          fi

          git commit \
            -m "Phase 2: generate NEXT 3 image candidates"

          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # ======================================================
      # FINAL
      #
      # Human selects:
      #
      # image 1-3
      # +
      # title 1-3
      #
      # Only here may READY_TO_PUBLISH be committed.
      # ======================================================

      - name: Commit final image + title selection
        if: steps.result.outputs.action == 'READY_TO_PUBLISH'
        id: selection_commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/
          git add automation_images/canonical/

          if git diff --cached --quiet; then
            echo "No final-selection changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit \
            -m "Phase 2: approve final image and title"

          git pull --rebase --autostash origin main
          git push origin HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"

      # ======================================================
      # Website publish only AFTER READY_TO_PUBLISH
      # ======================================================

      - name: Trigger Website Publish automatically
        if: |
          steps.result.outputs.action == 'READY_TO_PUBLISH' &&
          steps.selection_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Final image + title committed."
          echo "Triggering Website Publish..."

          gh workflow run website-publish.yml \
            --ref main

          echo "Website Publish triggered."

      # ======================================================
      # Report current phase
      # ======================================================

      - name: Phase boundary
        shell: bash
        run: |
          echo "Current result: ${{ steps.result.outputs.action }}"

          if [ "${{ steps.result.outputs.action }}" = "APPROVED_IMAGE_CONCEPT" ]; then
            echo "One of three image concepts was selected."
            echo "Exactly three real images were generated from that one locked concept."
            echo "Waiting for final image + title selection."
          fi

          if [ "${{ steps.result.outputs.action }}" = "NEXT_3_REQUESTED" ]; then
            echo "NEXT 3 was requested."
            echo "The selected concept remained locked."
            echo "Exactly three new real images were generated."
          fi

          if [ "${{ steps.result.outputs.action }}" = "READY_TO_PUBLISH" ]; then
            echo "Final image + title selected."
            echo "Canonical image created."
            echo "READY_TO_PUBLISH created."
          fi

          if [ "${{ steps.result.outputs.action }}" = "WAIT" ]; then
            echo "No valid new design selection detected."
          fi

          if [ "${{ steps.result.outputs.action }}" = "ALREADY_SELECTED" ]; then
            echo "Final design selection was already completed."
          fi

      # ======================================================
      # Failure notification
      # ======================================================

      - name: Notify failure by email
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FAILURE_STAGE: Design Selection / NEXT 3 / Final Approval
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/send_workflow_failure_email.py
