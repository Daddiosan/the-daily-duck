name: The Daily Duck - Design Selection Check

on:
  workflow_dispatch:

  schedule:
    - cron: "9,24,39,54 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-duck-design-selection
  cancel-in-progress: false

jobs:
  check-selection:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # 2. Sync latest main
      #
      # This workflow is scheduled every 15 minutes and may
      # also be started manually. Always use the newest state.
      # ======================================================

      - name: Sync latest main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

          echo "Repository synchronized to:"
          git rev-parse HEAD

      # ======================================================
      # 3. Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 4. Dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-phase2.txt

      # ======================================================
      # 5. Check design reply
      #
      # NEW ONE-TURN DESIGN FLOW
      #
      # The Design Options workflow already sends:
      #
      #   - 3 visual concepts
      #   - 1 real image per concept
      #   - 3 title choices
      #
      # Human replies once:
      #
      #   IMAGE_NUMBER TITLE_NUMBER
      #
      # Examples:
      #
      #   1 3
      #   １ ３
      #
      # Regeneration:
      #
      #   NEXT 3
      #   ＮＥＸＴ ３
      #
      # check_design_selection.py also performs the actual
      # NEXT 3 image regeneration, so OpenAI credentials are
      # intentionally available in this step.
      # ======================================================

      - name: Check current design reply
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_IMAGE_SIZE: "1536x1024"
          OPENAI_IMAGE_QUALITY: medium
        run: |
          python scripts/check_design_selection.py

      # ======================================================
      # 6. Read checker result
      #
      # Expected actions:
      #
      # WAIT
      # READY_TO_PUBLISH
      # NEXT_3_GENERATED
      # SEND_DESIGN_EMAIL
      # ALREADY_SELECTED
      # ======================================================

      - name: Read result
        id: result
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/design_selection_result.json ]; then
            echo "ERROR: design_selection_result.json not found."
            exit 1
          fi

          ACTION=$(python - <<'PY'
          import json

          with open(
              "automation_state/design_selection_result.json",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          print(data.get("action", ""))
          PY
          )

          if [ -z "$ACTION" ]; then
            echo "ERROR: design selection action is empty."
            exit 1
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Design action: $ACTION"

      # ======================================================
      # 7. NEXT 3 / recovery email
      #
      # NEXT_3_GENERATED:
      #   check_design_selection.py has already generated
      #   one fresh image for each of the same 3 concepts.
      #
      # SEND_DESIGN_EMAIL:
      #   recovery path when a design package exists but its
      #   approval email still needs to be sent.
      #
      # In both cases send_design_approval_email.py attaches
      # all three images and changes state to
      # WAITING_FINAL_SELECTION.
      # ======================================================

      - name: Send regenerated or recovered design email
        if: |
          steps.result.outputs.action == 'NEXT_3_GENERATED' ||
          steps.result.outputs.action == 'SEND_DESIGN_EMAIL'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/send_design_approval_email.py

      # ======================================================
      # 8. Commit NEXT 3 / recovered design package
      #
      # Saves:
      #   - new design images
      #   - updated design_options.json
      #   - design_selection_result.json
      # ======================================================

      - name: Commit regenerated or recovered design package
        if: |
          steps.result.outputs.action == 'NEXT_3_GENERATED' ||
          steps.result.outputs.action == 'SEND_DESIGN_EMAIL'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/
          git add automation_images/design_previews/

          echo "=== Git status before design package commit ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No regenerated/recovered design changes to commit."
            exit 0
          fi

          if [ "${{ steps.result.outputs.action }}" = "NEXT_3_GENERATED" ]; then
            COMMIT_MESSAGE="Phase 2: generate NEXT 3 concept images"
          else
            COMMIT_MESSAGE="Phase 2: recover design approval email state"
          fi

          git commit -m "$COMMIT_MESSAGE"

          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # ======================================================
      # 9. FINAL SELECTION
      #
      # Human chose:
      #
      #   image / concept 1-3
      #   title 1-3
      #
      # check_design_selection.py already created:
      #
      #   ready_to_publish.json
      #   canonical image
      #
      # Only now may publication begin.
      # ======================================================

      - name: Commit final image + title selection
        if: steps.result.outputs.action == 'READY_TO_PUBLISH'
        id: selection_commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/
          git add automation_images/canonical/

          echo "=== Git status before final selection commit ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No final-selection changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit \
            -m "Phase 2: approve final image and title"

          git pull --rebase --autostash origin main
          git push origin HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"

      # ======================================================
      # 10. Website Publish
      #
      # Website Publish automatically triggers X Publish
      # after successful website publication.
      # ======================================================

      - name: Trigger Website Publish automatically
        if: |
          steps.result.outputs.action == 'READY_TO_PUBLISH' &&
          steps.selection_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Final image + title committed."
          echo "Triggering Website Publish..."

          gh workflow run website-publish.yml \
            --ref main

          echo "Website Publish triggered."

      # ======================================================
      # 11. Report
      # ======================================================

      - name: Phase boundary
        shell: bash
        run: |
          echo "Design action: ${{ steps.result.outputs.action }}"

          if [ "${{ steps.result.outputs.action }}" = "WAIT" ]; then
            echo "No valid new design reply detected."
            echo "STATE: WAITING_FINAL_SELECTION"
          fi

          if [ "${{ steps.result.outputs.action }}" = "NEXT_3_GENERATED" ]; then
            echo "NEXT 3 accepted."
            echo "The same three concepts were preserved."
            echo "One fresh image was generated for each concept."
            echo "A new 3-image approval email was sent."
            echo "STATE: WAITING_FINAL_SELECTION"
          fi

          if [ "${{ steps.result.outputs.action }}" = "SEND_DESIGN_EMAIL" ]; then
            echo "Recovery mode."
            echo "Existing three design images were emailed."
            echo "STATE: WAITING_FINAL_SELECTION"
          fi

          if [ "${{ steps.result.outputs.action }}" = "READY_TO_PUBLISH" ]; then
            echo "Image/concept and title selected in one reply."
            echo "Canonical image created."
            echo "READY_TO_PUBLISH created."

            if [ "${{ steps.selection_commit.outputs.committed }}" = "true" ]; then
              echo "Website Publish trigger requested."
            fi
          fi

          if [ "${{ steps.result.outputs.action }}" = "ALREADY_SELECTED" ]; then
            echo "Final design selection was already completed."
            echo "No duplicate publication trigger was sent."
          fi

      # ======================================================
      # 12. Failure notification
      # ======================================================

      - name: Notify failure by email
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FAILURE_STAGE: Design Selection / NEXT 3 / Final Approval
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/send_workflow_failure_email.py
