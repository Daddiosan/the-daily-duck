name: The Daily Duck - Design Selection Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-duck-design-selection
  cancel-in-progress: false

jobs:
  check-selection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-phase2.txt

      - name: Check current design reply
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/check_design_selection.py

      - name: Read result
        id: result
        shell: bash
        run: |
          ACTION=$(python -c "import json; print(json.load(open('automation_state/design_selection_result.json',encoding='utf-8'))['action'])")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Design action: $ACTION"

      # ======================================================
      # Stage A:
      # Human selected one of the five concepts.
      # Persist selection before generating paid real images.
      # ======================================================

      - name: Commit selected image concept
        if: steps.result.outputs.action == 'APPROVED_IMAGE_CONCEPT'
        id: concept_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Phase 2: approve image concept"

          git pull --rebase origin main
          git push origin HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Generate exactly 5 real images from selected concept
        if: steps.result.outputs.action == 'APPROVED_IMAGE_CONCEPT'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_IMAGE_SIZE: "1536x1024"
          OPENAI_IMAGE_QUALITY: medium
        run: python scripts/generate_design_previews.py

      - name: Send final image + title approval email
        if: steps.result.outputs.action == 'APPROVED_IMAGE_CONCEPT'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_design_approval_email.py

      - name: Commit real-image batch
        if: steps.result.outputs.action == 'APPROVED_IMAGE_CONCEPT'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/
          git add automation_images/design_previews/

          if git diff --cached --quiet; then
            echo "No real-image batch changes to commit."
            exit 0
          fi

          git commit -m "Phase 2: generate 5 real image candidates"

          git pull --rebase origin main
          git push origin HEAD:main

      # ======================================================
      # Stage B:
      # NEXT 5 keeps the selected concept locked and creates a
      # fresh real-image batch.
      # ======================================================

      - name: Commit NEXT 5 request
        if: steps.result.outputs.action == 'NEXT_5_REQUESTED'
        id: next5_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Phase 2: request NEXT 5 image batch"

          git pull --rebase origin main
          git push origin HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Generate NEXT 5 real images from same selected concept
        if: steps.result.outputs.action == 'NEXT_5_REQUESTED'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_IMAGE_SIZE: "1536x1024"
          OPENAI_IMAGE_QUALITY: medium
        run: python scripts/generate_design_previews.py

      - name: Send NEXT 5 final approval email
        if: steps.result.outputs.action == 'NEXT_5_REQUESTED'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_design_approval_email.py

      - name: Commit NEXT 5 image batch
        if: steps.result.outputs.action == 'NEXT_5_REQUESTED'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/
          git add automation_images/design_previews/

          if git diff --cached --quiet; then
            echo "No NEXT 5 image changes to commit."
            exit 0
          fi

          git commit -m "Phase 2: generate NEXT 5 image candidates"

          git pull --rebase origin main
          git push origin HEAD:main

      # ======================================================
      # Final:
      # Human selected final image + title.
      # Only here can READY_TO_PUBLISH be committed.
      # ======================================================

      - name: Commit final image + title selection
        if: steps.result.outputs.action == 'READY_TO_PUBLISH'
        id: selection_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/
          git add automation_images/canonical/

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Phase 2: approve final image and title"

          git pull --rebase origin main
          git push origin HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Website Publish automatically
        if: |
          steps.result.outputs.action == 'READY_TO_PUBLISH' &&
          steps.selection_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Final image + title committed."
          echo "Triggering Website Publish..."

          gh workflow run website-publish.yml --ref main

          echo "Website Publish triggered."

      - name: Phase boundary
        run: |
          echo "Current result: ${{ steps.result.outputs.action }}"

          if [ "${{ steps.result.outputs.action }}" = "APPROVED_IMAGE_CONCEPT" ]; then
            echo "One image concept was selected."
            echo "Exactly five real images were generated from that one locked concept."
            echo "Waiting for final image + title selection."
          fi

          if [ "${{ steps.result.outputs.action }}" = "NEXT_5_REQUESTED" ]; then
            echo "NEXT 5 was requested."
            echo "The selected concept remained locked."
            echo "Exactly five new real images were generated."
          fi

          if [ "${{ steps.result.outputs.action }}" = "READY_TO_PUBLISH" ]; then
            echo "Final image + title selected."
            echo "Canonical image created."
            echo "READY_TO_PUBLISH created."
          fi

      - name: Notify failure by email
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FAILURE_STAGE: Design Selection / NEXT 5 / Final Approval
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/send_workflow_failure_email.py
