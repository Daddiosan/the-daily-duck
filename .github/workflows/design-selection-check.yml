name: The Daily Duck - Design Selection Check

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-duck-design-selection
  cancel-in-progress: false

jobs:
  check-selection:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # 2. Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 3. Dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-phase2.txt

      # ======================================================
      # 4. Check current design-selection reply
      #
      # Concept:
      #   1 / 2 / 3
      #   １ / ２ / ３
      #
      # Final:
      #   IMAGE TITLE
      #
      # Examples:
      #   2 1
      #   ２ １
      #
      # Regenerate:
      #   NEXT 3
      #   ＮＥＸＴ ３
      #
      # ======================================================

      - name: Check current design reply
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/check_design_selection.py

      # ======================================================
      # 5. Read checker result
      # ======================================================

      - name: Read result
        id: result
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/design_selection_result.json ]; then
            echo "ERROR: design_selection_result.json not found."
            exit 1
          fi

          ACTION=$(python - <<'PY'
          import json

          with open(
              "automation_state/design_selection_result.json",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          print(data.get("action", ""))
          PY
          )

          if [ -z "$ACTION" ]; then
            echo "ERROR: design selection action is empty."
            exit 1
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Checker action: $ACTION"

      # ======================================================
      # 6. Recovery / resume resolver
      #
      # Important:
      #
      # check_design_selection.py correctly returns WAIT when
      # design_options.json is already in APPROVED_IMAGE_CONCEPT.
      #
      # Normally that means another workflow step should act.
      #
      # If:
      #
      #   state = APPROVED_IMAGE_CONCEPT
      #   selected concept exists
      #   design_previews = []
      #
      # then image generation has not completed yet.
      #
      # Resume automatically without requiring the human
      # to reply to the concept email again.
      # ======================================================

      - name: Resolve effective action
        id: effective
        shell: bash
        run: |
          set -euo pipefail

          RAW_ACTION="${{ steps.result.outputs.action }}"

          EFFECTIVE_ACTION=$(python - <<'PY'
          import json
          from pathlib import Path

          raw_action = """${{ steps.result.outputs.action }}""".strip()

          path = Path("automation_state/design_options.json")

          if not path.exists():
              print(raw_action)
              raise SystemExit(0)

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          state = str(
              data.get("state") or ""
          ).upper()

          selected = data.get(
              "selected_image_concept"
          )

          selected_number = data.get(
              "selected_image_concept_number"
          )

          previews = data.get(
              "design_previews"
          )

          if not isinstance(previews, list):
              previews = []

          # --------------------------------------------------
          # Recovery case:
          #
          # Human already selected a concept,
          # but real-image generation has not completed.
          # --------------------------------------------------

          if (
              raw_action == "WAIT"
              and state == "APPROVED_IMAGE_CONCEPT"
              and isinstance(selected, dict)
              and selected_number in (1, 2, 3)
              and len(previews) == 0
          ):
              print("RESUME_IMAGE_GENERATION")
              raise SystemExit(0)

          # --------------------------------------------------
          # Existing action remains unchanged.
          # --------------------------------------------------

          print(raw_action)
          PY
          )

          if [ -z "$EFFECTIVE_ACTION" ]; then
            echo "ERROR: effective action is empty."
            exit 1
          fi

          echo "action=$EFFECTIVE_ACTION" >> "$GITHUB_OUTPUT"

          echo "Raw action: $RAW_ACTION"
          echo "Effective action: $EFFECTIVE_ACTION"

      # ======================================================
      # STAGE A
      #
      # Newly selected concept.
      #
      # Only a NEW concept selection needs this commit.
      #
      # A recovery run already has the selection committed,
      # so RESUME_IMAGE_GENERATION skips this step.
      # ======================================================

      - name: Commit selected image concept
        if: steps.effective.outputs.action == 'APPROVED_IMAGE_CONCEPT'
        id: concept_commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/

          if git diff --cached --quiet; then
            echo "No new concept selection to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit \
            -m "Phase 2: approve image concept"

          git pull --rebase --autostash origin main
          git push origin HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"

      # ======================================================
      # Generate exactly THREE real images.
      #
      # Runs for:
      #
      # 1. fresh concept selection
      # 2. recovery from APPROVED_IMAGE_CONCEPT
      #
      # ======================================================

      - name: Generate exactly 3 real images from selected concept
        if: |
          steps.effective.outputs.action == 'APPROVED_IMAGE_CONCEPT' ||
          steps.effective.outputs.action == 'RESUME_IMAGE_GENERATION'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_IMAGE_SIZE: "1536x1024"
          OPENAI_IMAGE_QUALITY: medium
          REAL_IMAGE_COUNT: "3"
        run: |
          python scripts/generate_design_previews.py

      # ======================================================
      # Send three real images + three title choices.
      # ======================================================

      - name: Send final image + title approval email
        if: |
          steps.effective.outputs.action == 'APPROVED_IMAGE_CONCEPT' ||
          steps.effective.outputs.action == 'RESUME_IMAGE_GENERATION'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/send_design_approval_email.py

      # ======================================================
      # Commit the THREE-image batch and updated waiting state.
      # ======================================================

      - name: Commit real-image batch
        if: |
          steps.effective.outputs.action == 'APPROVED_IMAGE_CONCEPT' ||
          steps.effective.outputs.action == 'RESUME_IMAGE_GENERATION'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/
          git add automation_images/design_previews/

          echo "=== Git status before real-image commit ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No real-image batch changes to commit."
            exit 0
          fi

          git commit \
            -m "Phase 2: generate 3 real image candidates"

          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # ======================================================
      # STAGE B — NEXT 3
      #
      # Human did not like the current three images.
      #
      # The selected concept remains LOCKED.
      # ======================================================

      - name: Commit NEXT 3 request
        if: steps.effective.outputs.action == 'NEXT_3_REQUESTED'
        id: next3_commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/

          if git diff --cached --quiet; then
            echo "No NEXT 3 request changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit \
            -m "Phase 2: request NEXT 3 image batch"

          git pull --rebase --autostash origin main
          git push origin HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"

      # ======================================================
      # Generate fresh THREE images from same concept.
      # ======================================================

      - name: Generate NEXT 3 real images from same selected concept
        if: steps.effective.outputs.action == 'NEXT_3_REQUESTED'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_IMAGE_SIZE: "1536x1024"
          OPENAI_IMAGE_QUALITY: medium
          REAL_IMAGE_COUNT: "3"
        run: |
          python scripts/generate_design_previews.py

      # ======================================================
      # Send NEXT 3 batch.
      # ======================================================

      - name: Send NEXT 3 final approval email
        if: steps.effective.outputs.action == 'NEXT_3_REQUESTED'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/send_design_approval_email.py

      # ======================================================
      # Commit NEXT 3 batch.
      # ======================================================

      - name: Commit NEXT 3 image batch
        if: steps.effective.outputs.action == 'NEXT_3_REQUESTED'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/
          git add automation_images/design_previews/

          echo "=== Git status before NEXT 3 commit ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No NEXT 3 image changes to commit."
            exit 0
          fi

          git commit \
            -m "Phase 2: generate NEXT 3 image candidates"

          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # ======================================================
      # FINAL
      #
      # Human selects:
      #
      # IMAGE 1-3
      # +
      # TITLE 1-3
      #
      # Example:
      #
      #   2 1
      #   ２ １
      #
      # ======================================================

      - name: Commit final image + title selection
        if: steps.effective.outputs.action == 'READY_TO_PUBLISH'
        id: selection_commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/
          git add automation_images/canonical/

          if git diff --cached --quiet; then
            echo "No final-selection changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit \
            -m "Phase 2: approve final image and title"

          git pull --rebase --autostash origin main
          git push origin HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"

      # ======================================================
      # Website Publish
      #
      # Only after final image + title selection.
      # ======================================================

      - name: Trigger Website Publish automatically
        if: |
          steps.effective.outputs.action == 'READY_TO_PUBLISH' &&
          steps.selection_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Final image + title committed."
          echo "Triggering Website Publish..."

          gh workflow run website-publish.yml \
            --ref main

          echo "Website Publish triggered."

      # ======================================================
      # Report phase
      # ======================================================

      - name: Phase boundary
        shell: bash
        run: |
          echo "Checker result: ${{ steps.result.outputs.action }}"
          echo "Effective result: ${{ steps.effective.outputs.action }}"

          if [ "${{ steps.effective.outputs.action }}" = "APPROVED_IMAGE_CONCEPT" ]; then
            echo "A new image concept was selected."
            echo "Exactly three real images were generated."
            echo "Waiting for final image + title selection."
          fi

          if [ "${{ steps.effective.outputs.action }}" = "RESUME_IMAGE_GENERATION" ]; then
            echo "Recovery mode activated."
            echo "The previously selected concept remained locked."
            echo "Exactly three real images were generated."
            echo "Waiting for final image + title selection."
          fi

          if [ "${{ steps.effective.outputs.action }}" = "NEXT_3_REQUESTED" ]; then
            echo "NEXT 3 was requested."
            echo "The selected concept remained locked."
            echo "Exactly three fresh images were generated."
          fi

          if [ "${{ steps.effective.outputs.action }}" = "READY_TO_PUBLISH" ]; then
            echo "Final image + title selected."
            echo "Canonical image created."
            echo "READY_TO_PUBLISH created."
          fi

          if [ "${{ steps.effective.outputs.action }}" = "WAIT" ]; then
            echo "No new valid design action detected."
          fi

          if [ "${{ steps.effective.outputs.action }}" = "ALREADY_SELECTED" ]; then
            echo "Final design selection was already completed."
          fi

      # ======================================================
      # Failure notification
      # ======================================================

      - name: Notify failure by email
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FAILURE_STAGE: Design Selection / Recovery / NEXT 3 / Final Approval
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/send_workflow_failure_email.py
