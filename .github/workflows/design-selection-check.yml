name: The Daily Duck - Design Selection Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-duck-design-selection
  cancel-in-progress: false

jobs:
  check-selection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check image + title reply
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/check_design_selection.py

      - name: Read result
        id: result
        shell: bash
        run: |
          ACTION=$(python -c "import json; print(json.load(open('automation_state/design_selection_result.json',encoding='utf-8'))['action'])")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Design action: $ACTION"

      - name: Commit final selection
        if: steps.result.outputs.action == 'READY_TO_PUBLISH'
        id: selection_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation_state/
          git add automation_images/canonical/
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Phase 2: approve final image and title"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"


      - name: Trigger Website Publish automatically
        if: |
          steps.result.outputs.action == 'READY_TO_PUBLISH' &&
          steps.selection_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Final image + title committed."
          echo "Triggering Website Publish..."
          gh workflow run website-publish.yml --ref main
          echo "Website Publish triggered."

      - name: Phase boundary
        if: steps.result.outputs.action == 'READY_TO_PUBLISH'
        run: |
          echo "READY_TO_PUBLISH created."
          echo "Selected preview image is now the canonical website image."
          echo "No 5-image generation / NEXT 5 / Gate B stage exists in this flow."
          echo "Website/X publishing remains a separate safety step."


      - name: Notify failure by email
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FAILURE_STAGE: Design Selection approval
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/send_workflow_failure_email.py
