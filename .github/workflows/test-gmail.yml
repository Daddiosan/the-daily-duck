name: Test Gmail SMTP

on:
  workflow_dispatch:

jobs:
  test-gmail:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send test email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          sender = os.environ["GMAIL_ADDRESS"].strip()
          password = os.environ["GMAIL_APP_PASSWORD"].strip().replace(" ", "")
          recipient = os.environ["EMAIL_TO"].strip()

          print("=== Gmail SMTP Test ===")
          print("Sender secret:", "OK" if sender else "MISSING")
          print("Password secret:", "OK" if password else "MISSING")
          print("Recipient secret:", "OK" if recipient else "MISSING")

          msg = EmailMessage()
          msg["Subject"] = "The Daily Duck - Gmail Test"
          msg["From"] = sender
          msg["To"] = recipient
          msg.set_content(
              "SUCCESS!\n\n"
              "GitHub Actions successfully sent this email through Gmail SMTP.\n\n"
              "The Daily Duck"
          )

          context = ssl.create_default_context()

          print("Connecting to smtp.gmail.com...")

          with smtplib.SMTP_SSL(
              "smtp.gmail.com",
              465,
              context=context,
              timeout=30
          ) as smtp:

              print("Connected.")
              print("Authenticating...")

              smtp.login(sender, password)

              print("Authentication SUCCESS.")
              print("Sending email...")

              smtp.send_message(msg)

              print("Email sent SUCCESSFULLY.")

          print("=== TEST SUCCESS ===")
          PY
