name: The Daily Duck - Image Concept Selection Check

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-duck-image-concept-selection
  cancel-in-progress: false

jobs:
  check-concept-selection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify image concept review state
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/image_concepts.json ]; then
            echo "ERROR: automation_state/image_concepts.json not found."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "automation_state/image_concepts.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          state = str(
              data.get("state", "")
          ).strip().upper()

          print(
              f"Detected state: {state}"
          )

          if state != "IMAGE_CONCEPT_REVIEW":
              raise SystemExit(
                  "ERROR: Expected IMAGE_CONCEPT_REVIEW, "
                  f"got {state!r}."
              )

          concepts = data.get(
              "concepts"
          )

          if (
              not isinstance(concepts, list)
              or len(concepts) != 3
          ):
              raise SystemExit(
                  "ERROR: Exactly three concepts are required."
              )

          for index, concept in enumerate(
              concepts,
              start=1
          ):
              if not isinstance(
                  concept,
                  dict
              ):
                  raise SystemExit(
                      f"ERROR: Concept {index} is invalid."
                  )

              if int(
                  concept.get(
                      "number",
                      0
                  )
              ) != index:
                  raise SystemExit(
                      f"ERROR: Concept numbering problem at {index}."
                  )

              web_path = str(
                  concept.get(
                      "web_image_path",
                      ""
                  )
              ).strip()

              x_path = str(
                  concept.get(
                      "x_image_path",
                      ""
                  )
              ).strip()

              if not web_path:
                  raise SystemExit(
                      f"ERROR: Concept {index} has no WEB image."
                  )

              if not x_path:
                  raise SystemExit(
                      f"ERROR: Concept {index} has no X image."
                  )

              if not Path(
                  web_path
              ).exists():
                  raise SystemExit(
                      f"ERROR: Missing WEB image: {web_path}"
                  )

              if not Path(
                  x_path
              ).exists():
                  raise SystemExit(
                      f"ERROR: Missing X image: {x_path}"
                  )

          print(
              "IMAGE_CONCEPT_REVIEW confirmed."
          )

          print(
              "Exactly 3 WEB/X image sets confirmed."
          )
          PY

      - name: Check image selection email reply
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        shell: bash
        run: |
          set -euo pipefail

          python scripts/check_image_concept_selection.py

      - name: Check whether image set was selected
        id: selected
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/approved_image_concept.json ]; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "No image set selected yet."
            exit 0
          fi

          STATE=$(python -c "import json; print(json.load(open('automation_state/approved_image_concept.json', encoding='utf-8')).get('state',''))")

          NUMBER=$(python -c "import json; print(json.load(open('automation_state/approved_image_concept.json', encoding='utf-8')).get('selected_image_concept_number',''))")

          echo "Selected state: $STATE"
          echo "Selected image set: $NUMBER"

          if [ "$STATE" = "APPROVED_IMAGE_CONCEPT" ]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote selected WEB and X images to canonical
        if: steps.selected.outputs.selected == 'true'
        id: promote
        shell: bash
        run: |
          set -euo pipefail

          python scripts/promote_selected_concept.py

          if [ ! -f automation_state/ready_to_publish.json ]; then
            echo "ERROR: ready_to_publish.json was not created."
            exit 1
          fi

          STATE=$(python -c "import json; print(json.load(open('automation_state/ready_to_publish.json', encoding='utf-8')).get('state',''))")

          echo "Generated state: $STATE"

          if [ "$STATE" = "READY_TO_PUBLISH" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit selected image set and READY_TO_PUBLISH
        if: |
          steps.selected.outputs.selected == 'true' &&
          steps.promote.outputs.ready == 'true'
        id: commit_ready
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/approved_image_concept.json
          git add automation_state/ready_to_publish.json
          git add automation_state/canonical/

          if git diff --cached --quiet; then
            echo "No new READY_TO_PUBLISH changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Gate B: approve Daily Duck WEB and X image set"

          git pull --rebase origin main
          git push origin HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Website Publish
        if: |
          steps.selected.outputs.selected == 'true' &&
          steps.promote.outputs.ready == 'true' &&
          steps.commit_ready.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "READY_TO_PUBLISH committed."
          echo "Triggering Website Publish..."

          gh workflow run website-publish.yml \
            --ref main

          echo "Website Publish workflow triggered."

      - name: Report result
        shell: bash
        run: |
          echo "Image selection workflow finished."

          if [ -f automation_state/approved_image_concept.json ]; then

            python - <<'PY'
          import json

          with open(
              "automation_state/approved_image_concept.json",
              encoding="utf-8"
          ) as f:
              selected = json.load(f)

          print(
              "STATE:",
              selected.get("state")
          )

          print(
              "Selected image set:",
              selected.get(
                  "selected_image_concept_number"
              )
          )

          print(
              "WEB image:",
              selected.get(
                  "selected_web_image_path"
              )
          )

          print(
              "X image:",
              selected.get(
                  "selected_x_image_path"
              )
          )
          PY

          else
            echo "STATE: IMAGE_CONCEPT_REVIEW"
            echo "Waiting for reply: 1 / 2 / 3"
          fi
