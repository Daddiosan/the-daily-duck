name: The Daily Duck - Image Concept Selection Check

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: daily-duck-image-concept-selection
  cancel-in-progress: false

jobs:
  check-concept-selection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify image concept review state
        shell: bash
        run: |
          set -euo pipefail

          test -f automation_state/image_concepts.json

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "automation_state/image_concepts.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          state = str(
              data.get("state", "")
          ).strip().upper()

          print(f"Detected state: {state}")

          if state != "IMAGE_CONCEPT_REVIEW":
              raise SystemExit(
                  "ERROR: Expected IMAGE_CONCEPT_REVIEW, "
                  f"got {state!r}."
              )

          concepts = data.get("concepts")

          if (
              not isinstance(concepts, list)
              or len(concepts) != 5
          ):
              raise SystemExit(
                  "ERROR: Exactly five concepts required."
              )

          print(
              "IMAGE_CONCEPT_REVIEW confirmed."
          )
          PY

      - name: Check image concept email reply
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/check_image_concept_selection.py

      - name: Promote selected preview to canonical image
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/approved_image_concept.json ]; then
            echo "No approved image concept yet."
            exit 0
          fi

          python scripts/promote_selected_concept.py

      - name: Commit selected concept and READY_TO_PUBLISH
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/approved_image_concept.json ]; then
            echo "No approved concept."
            exit 0
          fi

          if [ ! -f automation_state/ready_to_publish.json ]; then
            echo "No READY_TO_PUBLISH."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/approved_image_concept.json
          git add automation_state/ready_to_publish.json
          git add automation_state/canonical/

          if git diff --cached --quiet; then
            echo "No new publish state to commit."
            exit 0
          fi

          git commit -m "Gate B: approve canonical Daily Duck image"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report result
        shell: bash
        run: |
          if [ -f automation_state/ready_to_publish.json ]; then
            python - <<'PY'
          import json

          with open(
              "automation_state/ready_to_publish.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("STATE:", data.get("state"))
          print(
              "Selected concept:",
              data.get(
                  "selected_image_concept_number"
              )
          )
          print(
              "Canonical image:",
              data.get(
                  "canonical_image_path"
              )
          )
          PY
          else
            echo "STATE: IMAGE_CONCEPT_REVIEW"
          fi
