name: The Daily Duck Approval Check

on:
  # Manual test
  workflow_dispatch:

  # Check every 15 minutes
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: read
  contents: write

jobs:
  check-approval:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. Show start message
      # ------------------------------------------------------
      - name: Show approval check start message
        run: |
          echo "The Daily Duck approval check started."
          echo "Current UTC time:"
          date

      # ------------------------------------------------------
      # 3. Find latest successful Daily Duck workflow run
      # ------------------------------------------------------
      - name: Find latest Daily Duck workflow run
        id: find-run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_ID=$(gh run list \
            --workflow daily-duck.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful daily-duck.yml run found."
            exit 1
          fi

          echo "Latest successful run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------
      # 4. Download latest Gate A artifact
      # ------------------------------------------------------
      - name: Download latest Daily Duck results
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p downloaded-results

          gh run download \
            "${{ steps.find-run.outputs.run_id }}" \
            --name daily-duck-news-results \
            --dir downloaded-results

          echo "Downloaded files:"
          find downloaded-results -maxdepth 2 -type f -print

      # ------------------------------------------------------
      # 5. Copy Gate A package to working directory
      # ------------------------------------------------------
      - name: Prepare Gate A package
        run: |
          if [ ! -f downloaded-results/gate_a_package.json ]; then
            echo "gate_a_package.json was not found."
            exit 1
          fi

          cp downloaded-results/gate_a_package.json gate_a_package.json

          echo "Gate A package prepared."

      # ------------------------------------------------------
      # 6. Check Gmail for exact OK approval
      # ------------------------------------------------------
      - name: Check Gate A email approval
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python scripts/check_story_approval.py

      # ------------------------------------------------------
      # 7. Check whether approval was created
      # ------------------------------------------------------
      - name: Check approval result
        id: approval-result
        run: |
          if [ -f automation_state/approved_story.json ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "APPROVED_STORY detected."
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "No approval detected."
          fi

      # ------------------------------------------------------
      # 8. Commit APPROVED_STORY only when exact OK was found
      # ------------------------------------------------------
      - name: Save approved story
        if: steps.approval-result.outputs.approved == 'true'
        run: |
          git config user.name "The Daily Duck Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add automation_state/approved_story.json

          if git diff --cached --quiet; then
            echo "No new approval changes to commit."
            exit 0
          fi

          git commit -m "Approve Daily Duck story"

          git push

      # ------------------------------------------------------
      # 9. Complete
      # ------------------------------------------------------
      - name: Complete approval check
        run: |
          echo "The Daily Duck approval check completed."
