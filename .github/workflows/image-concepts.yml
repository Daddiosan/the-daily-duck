name: Daily Duck Image Concepts

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "automation_state/approved_story.json"

permissions:
  contents: write

concurrency:
  group: daily-duck-image-concepts
  cancel-in-progress: false

jobs:
  generate-and-email-concepts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install google-genai openai pillow
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Verify approved story
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("automation_state/approved_story.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: automation_state/approved_story.json missing."
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          state = str(
              data.get("state", "")
          ).strip().upper()

          print(f"Detected state: {state}")

          if state != "APPROVED_STORY":
              raise SystemExit(
                  f"ERROR: Expected APPROVED_STORY, got {state!r}."
              )

          print("APPROVED_STORY confirmed.")
          PY

      - name: Generate three image concepts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_image_concepts.py

      - name: Generate three website images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: "gpt-image-2"
          OPENAI_WEB_IMAGE_SIZE: "1536x1024"
          OPENAI_WEB_IMAGE_QUALITY: "low"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_concept_preview_images.py

      - name: Generate three X brand cards
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_x_cards.py

      - name: Verify generated assets
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "automation_state/image_concepts.json"
          )

          if not path.exists():
              raise SystemExit(
                  "ERROR: image_concepts.json not found."
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          state = str(
              data.get("state", "")
          ).strip().upper()

          if state != "IMAGE_CONCEPT_REVIEW":
              raise SystemExit(
                  f"ERROR: Expected IMAGE_CONCEPT_REVIEW, got {state!r}."
              )

          concepts = data.get("concepts")

          if (
              not isinstance(concepts, list)
              or len(concepts) != 3
          ):
              raise SystemExit(
                  "ERROR: Exactly 3 concepts are required."
              )

          for index, concept in enumerate(
              concepts,
              start=1
          ):
              if not isinstance(concept, dict):
                  raise SystemExit(
                      f"ERROR: Concept {index} is invalid."
                  )

              if int(
                  concept.get("number", 0)
              ) != index:
                  raise SystemExit(
                      f"ERROR: Concept numbering error at {index}."
                  )

              web_path = Path(
                  str(
                      concept.get(
                          "web_image_path",
                          ""
                      )
                  )
              )

              x_path = Path(
                  str(
                      concept.get(
                          "x_image_path",
                          ""
                      )
                  )
              )

              if not web_path.exists():
                  raise SystemExit(
                      f"ERROR: Missing WEB image: {web_path}"
                  )

              if not x_path.exists():
                  raise SystemExit(
                      f"ERROR: Missing X image: {x_path}"
                  )

          print("3 WEB images confirmed.")
          print("3 X brand cards confirmed.")
          print("STATE: IMAGE_CONCEPT_REVIEW")
          PY

      - name: Send three WEB and X image sets by email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/send_image_concept_email.py

      - name: Upload image set artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-duck-image-sets
          path: |
            automation_state/image_concepts.json
            automation_state/concept_assets/web/
            automation_state/concept_assets/x/
            image_concept_email.txt
          retention-days: 7

      - name: Commit generated image sets
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/image_concepts.json
          git add automation_state/concept_assets/

          if git diff --cached --quiet; then
            echo "No image set changes to commit."
            exit 0
          fi

          git commit -m "automation: generate three WEB and X image sets"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report result
        shell: bash
        run: |
          echo "Daily Duck image workflow completed."
          echo "WEB images: 3"
          echo "X brand cards: 3"
          echo "Email attachments: 6"
          echo "Valid selection replies: 1 / 2 / 3"
          echo "STATE: IMAGE_CONCEPT_REVIEW"
