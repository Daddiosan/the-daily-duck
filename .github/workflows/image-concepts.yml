name: Daily Duck Image Concepts

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "automation_state/approved_story.json"

permissions:
  contents: write

concurrency:
  group: daily-duck-image-concepts
  cancel-in-progress: false

jobs:
  generate-and-email-concepts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai openai

      - name: Verify approved story exists
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/approved_story.json ]; then
            echo "ERROR: automation_state/approved_story.json not found."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("automation_state/approved_story.json")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          state = str(
              data.get("state", "")
          ).strip().upper()

          print(f"Detected state: {state}")

          if state != "APPROVED_STORY":
              raise SystemExit(
                  "ERROR: Image concepts require "
                  f"APPROVED_STORY, got {state!r}."
              )

          print("APPROVED_STORY confirmed.")
          PY

      - name: Generate five image concepts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_image_concepts.py

      - name: Generate five concept preview images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_PREVIEW_IMAGE_SIZE: 1024x1024
          OPENAI_PREVIEW_IMAGE_QUALITY: low
        run: |
          python scripts/generate_concept_preview_images.py

      - name: Verify five preview images
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          meta_path = Path(
              "automation_state/image_concepts.json"
          )

          if not meta_path.exists():
              raise SystemExit(
                  "ERROR: image_concepts.json not found."
              )

          data = json.loads(
              meta_path.read_text(
                  encoding="utf-8"
              )
          )

          if data.get("state") != "IMAGE_CONCEPT_REVIEW":
              raise SystemExit(
                  "ERROR: Expected IMAGE_CONCEPT_REVIEW."
              )

          concepts = data.get("concepts")

          if (
              not isinstance(concepts, list)
              or len(concepts) != 5
          ):
              raise SystemExit(
                  "ERROR: Exactly five concepts are required."
              )

          for index, concept in enumerate(
              concepts,
              start=1,
          ):
              image_path = str(
                  concept.get(
                      "preview_image_path",
                      "",
                  )
              ).strip()

              if not image_path:
                  raise SystemExit(
                      f"ERROR: Concept {index} "
                      "has no preview image path."
                  )

              if not Path(image_path).exists():
                  raise SystemExit(
                      f"ERROR: Missing {image_path}"
                  )

          print(
              "Exactly five concept preview images confirmed."
          )
          PY

      - name: Send image concept selection email with previews
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/send_image_concept_email.py

      - name: Upload image concept artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-duck-image-concepts
          path: |
            automation_state/image_concepts.json
            automation_state/concept_previews/
            image_concept_email.txt
          retention-days: 7

      - name: Commit image concept review state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/image_concepts.json
          git add automation_state/concept_previews/

          if git diff --cached --quiet; then
            echo "No image concept state changes to commit."
            exit 0
          fi

          git commit -m "automation: generate image concepts with previews"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report result
        run: |
          echo "Image concept workflow finished."
          echo "Concepts: 5"
          echo "Preview images: 5"
          echo "STATE: IMAGE_CONCEPT_REVIEW"
