name: Daily Duck Design Options

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  design-options:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-phase2.txt
      - name: Generate 3 image concepts + 3 title ideas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.6-flash
        run: python scripts/generate_image_concepts.py
      - name: Send combined approval email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_image_concept_email.py
      - name: Commit design options
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation_state/design_options.json
          git diff --cached --quiet && exit 0
          git commit -m "Phase 2: create design options"
          git pull --rebase origin main
          git push origin HEAD:main
