name: Daily Duck Image Concepts

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "automation_state/approved_story.json"

permissions:
  contents: write

concurrency:
  group: daily-duck-image-concepts
  cancel-in-progress: false

jobs:
  generate-and-email-concepts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai openai pillow

      - name: Verify approved story exists
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f automation_state/approved_story.json ]; then
            echo "ERROR: automation_state/approved_story.json not found."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("automation_state/approved_story.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          state = str(data.get("state", "")).strip().upper()

          print(f"Detected state: {state}")

          if state != "APPROVED_STORY":
              raise SystemExit(
                  f"ERROR: Image concepts require APPROVED_STORY, got {state!r}."
              )

          print("APPROVED_STORY confirmed.")
          PY

      # ------------------------------------------------------
      # 1. Generate five written image concepts
      # ------------------------------------------------------

      - name: Generate five image concepts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_image_concepts.py

      # ------------------------------------------------------
      # 2. Generate ONE preview image for EACH concept
      #    Concept 1 -> preview 1
      #    Concept 2 -> preview 2
      #    ...
      #    Concept 5 -> preview 5
      # ------------------------------------------------------

      - name: Generate five concept preview images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/generate_concept_preview_images.py

      - name: Verify five preview images
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          meta_path = Path("automation_state/image_concepts.json")

          if not meta_path.exists():
              raise SystemExit(
                  "ERROR: automation_state/image_concepts.json not found."
              )

          data = json.loads(
              meta_path.read_text(encoding="utf-8")
          )

          concepts = data.get("image_concepts")

          if not isinstance(concepts, list) or len(concepts) != 5:
              raise SystemExit(
                  "ERROR: Exactly five image concepts are required."
              )

          missing = []

          for index, concept in enumerate(concepts, start=1):
              image_path = str(
                  concept.get("preview_image_path", "")
              ).strip()

              if not image_path:
                  missing.append(
                      f"Concept {index}: preview_image_path missing"
                  )
                  continue

              if not Path(image_path).exists():
                  missing.append(
                      f"Concept {index}: {image_path} not found"
                  )

          if missing:
              raise SystemExit(
                  "ERROR:\n" + "\n".join(missing)
              )

          print("Exactly five concept preview images confirmed.")
          PY

      # ------------------------------------------------------
      # 3. Email descriptions + five preview images
      # ------------------------------------------------------

      - name: Send image concept selection email with previews
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/send_image_concept_email.py

      # ------------------------------------------------------
      # Artifacts
      # ------------------------------------------------------

      - name: Upload image concept artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-duck-image-concepts
          path: |
            automation_state/image_concepts.json
            automation_state/concept_previews/
            image_concept_email.txt
          retention-days: 7

      # ------------------------------------------------------
      # Commit concept state + preview files
      # ------------------------------------------------------

      - name: Commit image concept review state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_state/image_concepts.json
          git add automation_state/concept_previews/

          if git diff --cached --quiet; then
            echo "No image concept state changes to commit."
            exit 0
          fi

          git commit -m "automation: generate image concepts with previews"

          git pull --rebase origin main
          git push origin HEAD:main
